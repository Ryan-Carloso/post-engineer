# Codecov coverage gates (free for public repos). These drive the
# codecov/project and codecov/patch status checks, which are required
# in the main branch ruleset. GitHub's native "Restrict code coverage"
# rule is NOT used: it requires a paid GitHub Team/Enterprise plan.
codecov:
  require_ci_to_pass: true

comment:
  # Show the total project coverage percentage (plus per-suite breakdown)
  # in the PR comment instead of the condensed default.
  layout: "header, diff, flags"
  behavior: default

# Pull requests upload coverage for the vitest files affected by the diff.
# Carry the rest forward from the base report so the project check does not
# treat unexecuted files as a coverage drop. main uploads a full report, which
# replaces every file that suite still loads.
flags:
  web:
    carryforward: true

coverage:
  # Vendored CalendarCN and ui-diff files are third-party code (see
  # .github/scripts/file-size/vendored-calendarcn.mjs, pinned to upstream
  # 6e15924d, and vendored-uidiff.mjs, pinned to upstream 3075b4c8): no test
  # in this repo targets lib internals, so their lines would fail the patch
  # gate with zero coverage. The ignore list is kept in sync with those
  # modules by vendored-calendarcn.test.mjs - edit the modules, not this
  # list by hand.
  ignore:
    - ".opencode/skills/ui-diff/bin/ui-diff.mjs"
    - ".opencode/skills/ui-diff/scripts/build-schema.ts"
    - ".opencode/skills/ui-diff/src/a11y.ts"
