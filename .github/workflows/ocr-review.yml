# OpenCodeReview (Alibaba OCR) — second AI code reviewer, running side by side
# with .github/workflows/opencode-review.yml for comparison testing.
#
# Trigger is `pull_request` (same as opencode-review.yml): this is a private
# repo where PRs come from same-repo branches, so ZAI_API_KEY is available.
# `pull_request` (unlike `pull_request_target`) also picks up this workflow
# file from the PR itself, so the side-by-side test starts on this very PR.
#
# Trust model (verified 2026-09-25 at action SHA 486022d — re-verify if the
# pin moves): the action installs the `ocr` CLI from npm and runs
# `ocr review` over git objects for the base-to-head range; it does not
# execute repo code (no build/install hooks, `.opencodereview/rule.json` is
# read as data only, no MCP configured). Note the action's own "checkout the
# trusted base" comment assumes pull_request_target semantics: under this
# workflow's `pull_request` trigger the checkout resolves to the PR merge ref,
# so the working tree DOES contain PR code — nothing in the action executes
# it at the pinned SHA.
#
# Secrets: real secrets are NEVER committed (see AGENTS.md env policy).
# As defense in depth, the env-guard step skips the review when
# any candidate diff range touches a path starting with `.env`, so their
# content never reaches the LLM. The OCR action's exact diff range is not
# pinned (it may diff the merge ref or the event-payload base..head SHAs),
# so the guard covers the union: merge-vs-base-tip, merge-vs-PR-head (which
# catches base-side changes the merge absorbed, e.g. a .env rotated on the
# base branch after the PR branched), and base-tip..PR-head fetched
# explicitly. It diffs with git instead of the GitHub API file list, which
# truncates on large PRs, and it first verifies the merge ref is a true
# merge commit, since a fast-forward merge ref would make HEAD^1 miss .env*
# changes from earlier commits. The guard fails closed (skips the review)
# on any unexpected shape or error.
# The pattern intentionally over-blocks (`.env.example`-style templates and
# names like `.env-backup` match too): a mislabeled template with real
# secrets must never reach the LLM, and over-blocking only skips the
# review — it never fails CI.
# The action reviews a diff range, so `.env*` files outside every candidate
# range are not part of the reviewed content (they are present in the
# merge-ref working tree, but outside the diff). If the action ever switched
# to whole-tree analysis, the env-guard alone would not suffice.
# Secrets are passed via `env:` / action inputs, never interpolated into
# `run:` scripts, per GitHub's hardening guide. (The PR number and base ref
# reach the guard via `env:`, and the checkout `ref:` — all GitHub-controlled
# values, safe outside `run:`.)
#
# LLM: the primary attempt uses the z.ai coding endpoint (glm-5.3-flash, same
# model as the OpenCode review); if that attempt fails (e.g. quota
# exhausted), a fallback attempt retries with the permanently-free
# glm-4.7-flash on z.ai's standard OpenAI-compatible endpoint. Same
# ZAI_API_KEY secret for both. Skips gracefully when the secret is not set.
# NOTE: the fallback does NOT cover action infra failures (e.g. the action
# failing to resolve its own ocr_version): those fail before any LLM call,
# so both attempts fail the same way and the job stays red, as it should.
# ocr_version is pinned (1.12.9, verified working 2026-09-25) because the
# action defaults to npm `latest`, which would float the reviewed binary.
#
# OCR posts its own sticky summary (marked <!-- ocr-summary -->) and inline
# comments, branded "OpenCodeReview"; the opencode review comment is untouched.

name: OCR Review (Alibaba OpenCodeReview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for ZAI_API_KEY
        id: key-check
        shell: bash
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ZAI_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAI_API_KEY secret is not set — skipping OCR review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR for env-guard diff
        id: guard-checkout
        if: steps.key-check.outputs.present == 'true'
        # A conflicting PR has no merge ref: fail the step, not the job —
        # env-guard then skips the review (fail closed) instead of dying
        # on a cryptic git error.
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          fetch-depth: 0
          # Pin the merge ref explicitly: the guard diffs the merge commit
          # against its first parent (the base), so it must see exactly the
          # tree the OCR action reviews — never stale event-payload SHAs.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Block review when PR touches secrets-bearing files
        id: env-guard
        if: steps.key-check.outputs.present == 'true'
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard-checkout.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Default to blocked: fail closed. If the merge ref cannot be
          # checked out (e.g. a conflicting PR), the review is skipped
          # instead of failing CI — or worse, running unguarded.
          blocked=true
          if [ "$GUARD_OUTCOME" = "success" ]; then
            # The merge ref must be a true merge commit (two parents: PR head
            # + base tip). When a PR is fast-forwardable, refs/pull/N/merge
            # can resolve to the bare PR head commit; then HEAD^1 is just the
            # previous PR commit and the diff below would miss .env* changes
            # from earlier commits — a silent under-block. Fail closed on any
            # unexpected shape: skip the review instead of running unguarded.
            parent_words=$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w || true)
            # Normalize to digits: wc pads its output with spaces, and any
            # unexpected (empty/non-numeric) value coerces to 0, so the
            # shape test below fails closed explicitly instead of relying
            # on `[` printing "integer expression expected" under `set -e`.
            parent_words=${parent_words//[[:space:]]/}
            case "$parent_words" in ''|*[!0-9]*) parent_words=0 ;; esac
            if [ "$parent_words" -ge 3 ]; then
              # The OCR action's exact diff range is not pinned: it may diff
              # the merge ref or the event-payload base..head SHAs. The guard
              # covers the union of candidate ranges and blocks if ANY of
              # them touches .env*:
              #   R1 = HEAD^1..HEAD (merge vs base tip),
              #   R2 = HEAD^2..HEAD (merge vs PR head — catches base-side
              #        changes the merge absorbed, e.g. a .env rotated on
              #        the base branch after the PR branched),
              #   R3 = base tip..PR head (the event-payload range, fetched
              #        explicitly via PR_NUMBER/BASE_REF from env:).
              # Unlike the GitHub API file list, git diff is not truncated
              # on large PRs. --no-renames is required: with rename
              # detection, a renamed .env* shows only the new path, so the
              # old path's secrets (present as removed lines in the reviewed
              # diff) would slip through; without it the old path appears as
              # a deletion and matches the pattern. Over-blocking only skips
              # the review — it never fails CI.
              pr_number="${PR_NUMBER:-}"
              base_ref="${BASE_REF:-}"
              # NOTE: no --depth here — a shallow fetch would mark the local
              # history shallow and break the HEAD^1/HEAD^2 diffs below. The
              # checkout already fetched full history, so this only adds refs.
              if [ -n "$pr_number" ] && [ -n "$base_ref" ] && \
                 git fetch --no-tags origin \
                   "+refs/pull/${pr_number}/head:refs/remotes/guard/pr-head" \
                   "+refs/heads/${base_ref}:refs/remotes/guard/base-tip" >/dev/null 2>&1; then
                env_hit=false
                for range in "HEAD^1 HEAD" "HEAD^2 HEAD" "refs/remotes/guard/base-tip refs/remotes/guard/pr-head"; do
                  # Word-splitting $range into $1/$2 is intentional.
                  # shellcheck disable=SC2086
                  set -- $range
                  if files=$(git diff --name-only --no-renames "$1" "$2" 2>/dev/null); then
                    if printf '%s\n' "$files" | grep -Eq '(^|/)\.env'; then
                      env_hit=true
                    fi
                  else
                    echo "::warning::git diff failed for range $1..$2 — skipping OCR review (fail closed)."
                    env_hit=true
                  fi
                done
                if [ "$env_hit" = false ]; then
                  blocked=false
                fi
              else
                echo "::warning::could not fetch PR head/base refs — skipping OCR review (fail closed)."
              fi
            else
              echo "::warning::merge ref is not a merge commit — skipping OCR review (fail closed)."
            fi
          else
            echo "::warning::Could not check out the PR merge ref — skipping OCR review (fail closed)."
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

      - name: Run OpenCodeReview
        id: ocr-primary
        # Fail-closed gate: `blocked == 'false'` (not `!= 'true'`) so a
        # missing/empty output — e.g. a refactor dropping the echo — blocks
        # the review instead of running it unguarded.
        if: steps.key-check.outputs.present == 'true' && steps.env-guard.outputs.blocked == 'false'
        # continue-on-error: a primary failure (e.g. model quota) must not
        # fail the job before the free-model fallback below gets its chance.
        # steps.ocr-primary.outcome still records 'failure', so the fallback
        # gate stays accurate.
        continue-on-error: true
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # pinned 2026-09-25
        with:
          llm_url: https://api.z.ai/api/coding/paas/v4
          llm_auth_token: ${{ secrets.ZAI_API_KEY }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: "false"
          ocr_version: "1.12.9" # pinned 2026-09-25; action default is npm `latest`

      - name: Run OpenCodeReview (free-model fallback)
        id: ocr-fallback
        # Same fail-closed gate as the primary, plus: only runs when the
        # primary attempt actually failed. Retries with the permanently-free
        # glm-4.7-flash on z.ai's standard endpoint, so reviews survive
        # Coding Plan quota exhaustion. This does not mask infra failures:
        # if the action itself is broken, this attempt fails too and the
        # job stays red.
        if: steps.key-check.outputs.present == 'true' && steps.env-guard.outputs.blocked == 'false' && steps.ocr-primary.outcome == 'failure'
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # pinned 2026-09-25
        with:
          llm_url: https://api.z.ai/api/paas/v4
          llm_auth_token: ${{ secrets.ZAI_API_KEY }}
          llm_model: glm-4.7-flash
          llm_use_anthropic: "false"
          ocr_version: "1.12.9" # pinned 2026-09-25; action default is npm `latest`
