name: release-mcp

# Publishes post-engineer-mcp to npm via trusted publishing (GitHub OIDC, no
# token), then to the official MCP Registry. The filename is load-bearing:
# npm's trusted publisher for the package names this exact workflow file
# (org Ryan-Carloso, repo post-engineer, workflow release-mcp.yml).
#
# VERSION — generated, never committed (.github/scripts/mcp-release-version.sh):
#   MAJOR.MINOR from the repo-root VERSION file + the number of the merged PR that
#   introduced the last commit touching apps/mcp/ (e.g. 1.52.560). No
#   version-bump commit, no bump PR, no manual tag. The publish job stamps the
#   version into package.json/server.json in its own workspace only.
#
# ONE VERSION, WEB AND MCP — the web accepts exactly one MCP version
# (apps/web/lib/mcp-version-gate.ts, X-MCP-Version vs REQUIRED_MCP_VERSION).
# The VPS deploy (deployment repo, deploy.sh) computes REQUIRED_MCP_VERSION
# with the same rule and deploys the web only once npm serves it, so a failed
# publish leaves the previous web (and the previous MCP) running instead of
# locking every agent out.
#
# SELF-HEALING — the run is level-triggered, like the deploy's .deploy-state:
# on every push to main that touches apps/mcp/, every 10 minutes, and on
# demand, it computes the version for main's HEAD and asks npm whether it
# already exists. Present: the run ends in seconds. Missing: build, test,
# publish. A transient npm or GitHub failure is retried by the next tick
# without anyone re-running anything; only a real breakage needs a human,
# and the deploy reports that wait on Discord.
#
# The MCP Registry (metadata only) runs in its own job after npm and never
# affects the deploy. If it fails, re-run it with Run workflow ->
# republish_registry.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp/**'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      republish_registry:
        description: 'Publish the current version to the MCP Registry even when npm already has it.'
        required: false
        type: boolean
        default: false

# One release at a time: a push run and a scheduled run must never publish
# the same version concurrently.
concurrency:
  group: mcp-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the mcp-v<version> tag
      id-token: write # npm trusted publishing / provenance
      pull-requests: read # commits/{sha}/pulls in mcp-release-version.sh
    outputs:
      version: ${{ steps.version.outputs.version }}
      published_now: ${{ steps.published.outputs.published_now }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          # Always main's HEAD: a scheduled or re-run job publishes what is
          # merged now, which is also what the deploy computes.
          ref: main
          # git log over apps/mcp/ needs the history.
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(bash .github/scripts/mcp-release-version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "post-engineer-mcp release version: ${VERSION}"

      - name: Check whether npm already serves this version
        id: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://registry.npmjs.org/post-engineer-mcp/${VERSION}" || true)"
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "npm already serves post-engineer-mcp@${VERSION}: nothing to publish."
              ;;
            404)
              # Never move `latest` back: an older apps/mcp/ PR merged after
              # a newer one computes a lower version (mcp-release-not-older.sh).
              latest_status="$(curl -s -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' --max-time 30 "https://registry.npmjs.org/post-engineer-mcp/latest" || true)"
              case "$latest_status" in
                200) published="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "$RUNNER_TEMP/latest.json")" ;;
                404) published="" ;;
                *)
                  echo "::error::npm answered HTTP ${latest_status:-none} for post-engineer-mcp@latest; the next run retries."
                  exit 1
                  ;;
              esac
              bash .github/scripts/mcp-release-not-older.sh "$VERSION" "$published"
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "npm does not serve post-engineer-mcp@${VERSION} yet: publishing."
              ;;
            *)
              # Neither answer is trustworthy: never publish on a guess. The
              # next scheduled run asks again.
              echo "::error::npm answered HTTP ${status:-none} for post-engineer-mcp@${VERSION}; the next run retries."
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.npm.outputs.exists == 'false'
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.npm.outputs.exists == 'false'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.npm.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Stamp the release version
        if: steps.npm.outputs.exists == 'false'
        run: bash .github/scripts/mcp-release-stamp.sh "${{ steps.version.outputs.version }}"

      - name: Build
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        run: pnpm build

      - name: Lint
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        run: pnpm lint

      - name: Typecheck
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        run: pnpm exec nx run mcp:typecheck

      - name: Unit tests
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        run: pnpm test

      # Before npm publish: a server.json drift must stop the release before
      # anything ships, not leave npm ahead of the registry metadata.
      - name: Verify server.json matches the package
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const pkg = require('./package.json');
            const server = require('./server.json');
            const version = process.env.VERSION;
            const fail = (msg) => { console.error('::error::' + msg); process.exit(1); };
            if (pkg.version !== version) fail('package.json version ' + pkg.version + ' != release version ' + version);
            if (server.name !== pkg.mcpName) fail('server.json name ' + server.name + ' != package.json mcpName ' + pkg.mcpName);
            if (server.version !== pkg.version) fail('server.json version ' + server.version + ' != package.json version ' + pkg.version);
            if (server.packages[0].version !== pkg.version) fail('server.json packages[0].version != package.json version');
          "

      - name: Publish to npm (trusted publishing)
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/mcp
        run: |
          set -euo pipefail
          # npm CLI bundled with Node 22 predates OIDC trusted publishing; upgrade first.
          npm install -g npm@latest
          npm publish --provenance --access public

      - name: Record the publish
        id: published
        if: steps.npm.outputs.exists == 'false'
        run: echo "published_now=true" >> "$GITHUB_OUTPUT"

      # Idempotent and run on every tick, so a tag push that failed after a
      # successful npm publish is created by the next run instead of never.
      # The tag marks the commit the version was computed from; the stamped
      # package.json is never committed.
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! curl -sf -o /dev/null --max-time 30 "https://registry.npmjs.org/post-engineer-mcp/${VERSION}"; then
            echo "npm does not serve ${VERSION} yet: the tag waits for the next run."
            exit 0
          fi
          TAG="mcp-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA="$(git log -1 --format=%H -- apps/mcp/)"
          git tag -a "${TAG}" -m "post-engineer-mcp v${VERSION}" "${SHA}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}."

  registry:
    needs: publish
    if: needs.publish.outputs.published_now == 'true' || (github.event_name == 'workflow_dispatch' && inputs.republish_registry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # MCP Registry GitHub OIDC login
    defaults:
      run:
        shell: bash
    env:
      PKG_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          ref: main

      # The registry reads server.json from the working directory, so it
      # needs the same stamped version npm received.
      - name: Stamp the release version
        run: bash .github/scripts/mcp-release-stamp.sh "${PKG_VERSION}"

      # Pinned by SHA-256 like the SHA-pinned actions: this job holds
      # id-token: write, so a re-pointed release tag must not run here.
      # Hash computed from the v1.8.7 tarball when it was pinned.
      - name: Install mcp-publisher
        working-directory: apps/mcp
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher

      # npm can take minutes to serve a just-published version, and the MCP
      # Registry verifies the version against npm before it accepts the
      # publish (every release from 1.39.0 to 1.42.0 failed here with a 404
      # while the version was still propagating). Poll until npm serves it.
      # Attempts/sleep are env-overridable for the committed test script.
      - name: Wait for npm propagation
        run: |
          set -euo pipefail
          MAX_ATTEMPTS="${REGISTRY_WAIT_ATTEMPTS:-40}"
          SLEEP_SECS="${REGISTRY_WAIT_SLEEP:-15}"
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if curl -fsSL "https://registry.npmjs.org/post-engineer-mcp/${PKG_VERSION}" -o /dev/null; then
              echo "npm serves post-engineer-mcp@${PKG_VERSION} (attempt ${attempt}/${MAX_ATTEMPTS})."
              exit 0
            fi
            echo "npm does not serve ${PKG_VERSION} yet (attempt ${attempt}/${MAX_ATTEMPTS}) — waiting ${SLEEP_SECS}s..."
            sleep "$SLEEP_SECS"
            attempt=$((attempt + 1))
          done
          echo "::error::npm still does not serve post-engineer-mcp@${PKG_VERSION} after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Publish to the MCP Registry
        working-directory: apps/mcp
        run: |
          set -euo pipefail
          # The Registry re-validates the npm version on every attempt, so a
          # transient propagation 404 is retried here as well as waited for
          # above. Log in again per attempt: the OIDC token is short-lived.
          attempt=1
          while true; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
              echo "Published io.github.Ryan-Carloso/post-engineer@${PKG_VERSION} to the MCP Registry."
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::MCP Registry publish failed after 3 attempts."
              exit 1
            fi
            echo "Registry publish attempt ${attempt}/3 failed — retrying in 60s..."
            attempt=$((attempt + 1))
            sleep 60
          done
