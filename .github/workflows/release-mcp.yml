name: release-mcp

# Publishes post-engineer-mcp to npm via trusted publishing (GitHub OIDC, no token).
#
# How to cut a release (after the changes are merged to main):
#   AUTOMATIC (preferred): the release-mcp-auto.yml workflow tags every main
#   merge that touches apps/mcp/ — no manual steps needed. When the tag for
#   the current version already exists, it opens a minor version-bump PR
#   with auto-merge enabled instead of skipping; merging that PR tags the
#   new version. A merge that touches only apps/mcp/package.json is tagged
#   directly, so a version-bump PR publishes on merge with no manual tag.
#   NOTE: the auto workflow pushes tags with MCP_RELEASE_TOKEN (a
#   fine-grained PAT), never with GITHUB_TOKEN — GitHub does not start
#   workflow runs for events created with GITHUB_TOKEN, so a tag pushed
#   with it would never start this workflow. If that secret is missing,
#   the auto job fails loudly instead of pushing anything.
#   MANUAL (fallback):
#     1. Bump the version in apps/mcp/package.json (e.g. 1.2.0 -> 1.3.0) AND
#        both version fields in apps/mcp/server.json (version and
#        packages[0].version), then push.
#     2. git tag -a mcp-v1.3.0 -m "post-engineer-mcp v1.3.0"
#     3. git push origin mcp-v1.3.0
#
# The tag version MUST match apps/mcp/package.json, and server.json must
# match package.json (name and both versions), or the job fails before
# publishing. One-time npm setup required: on npmjs.com, add this repo as a
# trusted publisher for the post-engineer-mcp package
# (org Ryan-Carloso, repo post-engineer, workflow release-mcp.yml).

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/mcp/package.json version ${PKG_VERSION}. Bump the version first, then tag."
            exit 1
          fi
          echo "Releasing post-engineer-mcp v${PKG_VERSION}"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec nx run mcp:typecheck

      - name: Unit tests
        run: pnpm test

      # Before npm publish: a server.json drift must stop the release before
      # anything ships, not leave npm ahead of a skipped registry publish.
      - name: Verify server.json matches the package
        run: |
          set -euo pipefail
          node -e "
            const pkg = require('./package.json');
            const server = require('./server.json');
            const fail = (msg) => { console.error('::error::' + msg); process.exit(1); };
            if (server.name !== pkg.mcpName) fail('server.json name ' + server.name + ' != package.json mcpName ' + pkg.mcpName);
            if (server.version !== pkg.version) fail('server.json version ' + server.version + ' != package.json version ' + pkg.version);
            if (server.packages[0].version !== pkg.version) fail('server.json packages[0].version != package.json version');
          "

      - name: Publish to npm (trusted publishing)
        run: |
          set -euo pipefail
          # npm CLI bundled with Node 22 predates OIDC trusted publishing; upgrade first.
          npm install -g npm@latest
          npm publish --provenance --access public

      # The official MCP Registry stores metadata only and verifies it
      # against the npm package just published (mcpName in package.json
      # must equal server.json name). GitHub OIDC login needs no secret:
      # the id-token: write permission above covers it.
      # Pinned by SHA-256 like the SHA-pinned actions: this job holds
      # id-token: write, so a re-pointed release tag must not run here.
      # Hash computed from the v1.8.7 tarball when it was pinned.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
