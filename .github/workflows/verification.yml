name: verification

# Mechanical verification evidence for every pull request.
#
# Fork-safe on purpose:
# - trigger is pull_request (the merge commit), never the target-event
#   variant that checks out pull-request code with this repository's secrets
# - no `secrets` context is read
# - checkout uses persist-credentials: false
# - steps that execute pull-request Python blank GITHUB_TOKEN
# - a fork token cannot write, so the comment step is skipped and the job
#   summary still holds the evidence table
#
# The grader script is taken from the base commit when that commit has one,
# so a pull request cannot silence a finding by editing the script. The pull
# request that introduces the script is graded by its own copy and says so.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-09-25
        with:
          python-version: "3.12"

      - name: Install grader test dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The grader runs from the base copy so a pull request cannot
          # silence a finding by editing the script. Its interpreter must
          # be built from the base requirements too: a pull-request
          # requirements file could redirect the index or install a
          # package whose install step poisons site-packages, and every
          # later python3 in this job would run that code.
          if git cat-file -e "${BASE_SHA}:.github/scripts/requirements-validator.txt" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/requirements-validator.txt" > /tmp/requirements-validator.txt
            python3 -m pip install --quiet -r /tmp/requirements-validator.txt
          else
            # The grader does not exist on the base yet; this pull request
            # is the one introducing it, so its copy is the only source.
            python3 -m pip install --quiet -r .github/scripts/requirements-validator.txt
          fi

      - name: Grade the diff and run diff-scoped tests
        id: grade
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The suites below run pull-request test code. It must not be able
          # to poison the runner for later steps by writing BASH_ENV into
          # GITHUB_ENV, or to append to the runner PATH.
          BASH_ENV: ""
          GITHUB_ENV: ""
          GITHUB_PATH: ""
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          grader_dir="$GITHUB_WORKSPACE/.github/scripts/verification"
          source="head"
          if git cat-file -e "${base}:.github/scripts/verification/collect.py" 2>/dev/null; then
            rm -rf /tmp/verifier
            mkdir -p /tmp/verifier
            git archive "$base" .github/scripts/verification | tar -x -C /tmp/verifier
            grader_dir="/tmp/verifier/.github/scripts/verification"
            source="base"
          fi
          echo "Grader source: ${source}"
          set +e
          python3 "$grader_dir/collect.py" \
            --repo "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head HEAD \
            --source "$source" \
            --json /tmp/honesty.json
          collect_code=$?
          # Hash the payload now, in a shell variable no test process can
          # rewrite: the suites below run pull-request test code on this
          # filesystem, and the hash is the only record of what the grader
          # actually found.
          honesty_sha=$(sha256sum /tmp/honesty.json | awk '{print $1}')
          set -e
          if [ "$collect_code" -gt 1 ]; then
            echo "collect.py failed (${collect_code})"
            exit "$collect_code"
          fi
          python3 -c 'import json,pathlib,sys; data=json.loads(pathlib.Path("/tmp/honesty.json").read_text(encoding="utf-8")); suites=data.get("local_suites") or []; allowed={"verification","review-scripts"}; sys.exit("refusing local_suites") if (not isinstance(suites, list) or any(item not in allowed for item in suites)) else pathlib.Path("/tmp/suites.txt").write_text("".join(item + "\n" for item in suites), encoding="utf-8")'
          echo '{}' > /tmp/suite-results.json
          suite_fail=0
          suite_codes=""
          while IFS= read -r suite; do
            [ -z "$suite" ] && continue
            log="/tmp/suite-${suite}.log"
            code=0
            case "$suite" in
              verification)
                python3 -m pytest .github/scripts/tests/test_verification_collect.py .github/scripts/tests/test_verification_workflow.py -q --tb=line >"$log" 2>&1 || code=$?
                ;;
              review-scripts)
                python3 -m pytest .github/scripts/tests -q --tb=line >"$log" 2>&1 || code=$?
                ;;
              *)
                echo "unknown suite" >&2
                exit 1
                ;;
            esac
            suite_codes="${suite_codes} ${suite}:${code}"
            if [ "$code" -ne 0 ]; then
              suite_fail=1
              tail -n 40 "$log" || true
            fi
          done < /tmp/suites.txt
          # Rebuild the suite results from the exit codes recorded above in
          # shell variables and the pytest logs on disk. A test that ran in
          # the loop shares this filesystem and could have rewritten the
          # file, so nothing it contains is trusted here.
          SUITE_CODES="$suite_codes" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {}
          for item in os.environ["SUITE_CODES"].split():
              name, code = item.split(":")
              log = Path(f"/tmp/suite-{name}.log")
              text = log.read_text(encoding="utf-8", errors="replace") if log.is_file() else ""
              data[name] = {"exit_code": int(code), "excerpt": text[-2000:]}
          Path("/tmp/suite-results.json").write_text(json.dumps(data), encoding="utf-8")
          PY
          set +e
          if [ "$(sha256sum /tmp/honesty.json | awk '{print $1}')" != "$honesty_sha" ]; then
            echo "::error::verification evidence payload was modified after grading; refusing to render"
            rm -f /tmp/evidence.md
            report_code=1
          else
            if [ "$source" = "base" ]; then
              # The suites above run pull-request test code on this
              # filesystem, so re-extract the base grader before rendering:
              # the copy it ran from may have been rewritten.
              rm -rf /tmp/verifier-render
              mkdir -p /tmp/verifier-render
              git archive "$base" .github/scripts/verification | tar -x -C /tmp/verifier-render
              grader_dir="/tmp/verifier-render/.github/scripts/verification"
            fi
            python3 "$grader_dir/report.py" \
              --honesty /tmp/honesty.json \
              --suites /tmp/suite-results.json \
              --markdown /tmp/evidence.md
            report_code=$?
          fi
          set -e
          if [ "$report_code" -gt 1 ]; then
            exit "$report_code"
          fi
          final=0
          if [ "$collect_code" -ne 0 ] || [ "$suite_fail" -ne 0 ] || [ "$report_code" -ne 0 ]; then
            final=1
          fi
          echo "exit_code=${final}" >> "$GITHUB_OUTPUT"
          # Fail here, in the step that graded: a later step cannot be
          # trusted to do it, since pull-request test code ran above and
          # could have poisoned the runner environment for later steps.
          if [ "$final" -ne 0 ]; then
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/evidence.md ]; then
            cat /tmp/evidence.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verification evidence was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post or update the evidence comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/evidence.md ]; then
            echo "no evidence file; skipping comment"
            exit 0
          fi
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "Fork pull request: comment skipped. Evidence is in the job summary. This workflow has no repository secret context."
            exit 0
          fi
          existing_id=$(gh api "repos/${BASE_REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- verification-evidence -->")) | .id' | head -n 1 || true)
          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/${BASE_REPO}/issues/comments/${existing_id}" -F body=@"/tmp/evidence.md" > /dev/null
            echo "updated comment ${existing_id}"
          else
            gh pr comment "$PR_NUMBER" --repo "$BASE_REPO" --body-file /tmp/evidence.md > /dev/null
            echo "posted comment"
          fi

      - name: Fail when evidence has a failure
        if: always()
        run: |
          set -euo pipefail
          code="${{ steps.grade.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::Verification evidence failed. See the job summary and the pull request comment."
            exit 1
          fi
          echo "Verification evidence passed."
