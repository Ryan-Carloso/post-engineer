name: workflow-secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-09-25
        with:
          node-version: '22'

      - name: Unit tests (workflow-secrets lint)
        run: node --test .github/scripts/workflow-secrets/check.test.mjs

      - name: Run workflow-secrets lint
        run: node .github/scripts/workflow-secrets/check.mjs
