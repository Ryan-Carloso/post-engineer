name: opencode-review

# Automatic PR review with OpenCode (replaces CodeRabbit).
#
# How it works:
# - Runs on GitHub-hosted runners — no VPS needed.
# - Installs a pinned OpenCode CLI release (version + sha256 checksum against
#   the official sst/opencode artifacts), then runs `opencode run` directly —
#   no third-party GitHub Action wrapper, no floating install script.
#   (Verified against the installed CLI: there is no --standalone flag;
#   `run` is already the non-interactive command for scripts/CI.)
# - Review chain, first success wins (free-first, paid as last resort):
#     1. OpenRouter free router (openrouter/free) — $0 models first
#     2. z.ai standard API with the permanently-free glm-4.7-flash
#     3. z.ai GLM Coding Plan (best quality, quota-limited)
#     4. OpenRouter auto router (openrouter/auto) — paid, last resort
#   glm-4.5-flash was dropped from the chain — its review quality was too
#   poor. The OpenRouter tiers use the special router ids (no hardcoded
#   model list to rot — same convention as the engine's _PROVIDER_DEFAULT_MODELS
#   in apps/engine/app/services/llm.py); one OPENROUTER_API_KEY secret serves
#   both tiers (free models cost $0 even on a paid key).
# - The job runs if EITHER ZAI_API_KEY or OPENROUTER_API_KEY is configured;
#   each tier is skipped when its key is missing, so a repo with only one
#   key still gets reviews through that provider's tiers.
# - Posts the review as a new PR comment on every push (the header carries
#   the head SHA), so each review round stays visible instead of overwriting
#   the previous one.
#
# Setup:
# 1. Add the `ZAI_API_KEY` and/or `OPENROUTER_API_KEY` secret (repo settings).
#    Until at least one exists, the review steps are skipped.
# 2. If your Coding Plan uses a different model id, change OPENCODE_MODEL below.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel a superseded review when new pushes arrive.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Review models. OPENCODE_MODEL is provider/model form;
  # ZAI_FREE_MODEL is a bare id resolved against the zai-standard provider,
  # OPENROUTER_FREE_MODEL / OPENROUTER_MODEL are router ids resolved
  # against the openrouter provider (all configured in the review step).
  # Try order is free-first: OPENROUTER_FREE_MODEL, ZAI_FREE_MODEL,
  # OPENCODE_MODEL, then OPENROUTER_MODEL (paid, last resort).
  OPENCODE_MODEL: zai-coding-plan/glm-5.3-flash
  # Permanently-free fallback on the z.ai standard API so reviews survive
  # Coding Plan quota exhaustion. Kept to glm-4.7-flash only — glm-4.5-flash
  # was removed for poor review quality.
  ZAI_FREE_MODEL: glm-4.7-flash
  # OpenRouter fallbacks after z.ai. Special router ids, not concrete models:
  # /free resolves to the best free model, /auto to the best paid model for
  # the task. One OPENROUTER_API_KEY serves both tiers.
  OPENROUTER_FREE_MODEL: openrouter/free
  OPENROUTER_MODEL: openrouter/auto

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check for review API keys
        id: check
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # has_key is the single gate for the whole job: the review runs if
          # EITHER provider key is configured. Per-tier outputs let the
          # review step skip the tiers whose key is missing.
          if [ -z "${ZAI_API_KEY:-}" ]; then
            echo "has_zai_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_zai_key=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "has_openrouter_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_openrouter_key=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${ZAI_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "Neither ZAI_API_KEY nor OPENROUTER_API_KEY is set — skipping OpenCode review."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenCode (pinned release)
        if: steps.check.outputs.has_key == 'true'
        env:
          OPENCODE_VERSION: "1.18.32"
          # sha256 of opencode-linux-x64.tar.gz for the release above, taken
          # from the official sst/opencode GitHub release. Bump both together;
          # never go back to a floating install script (an unpinned script's
          # download source has pointed at third-party forks).
          OPENCODE_SHA256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
        run: |
          set -euo pipefail
          URL="https://github.com/sst/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          curl -fsSL "$URL" -o /tmp/opencode.tar.gz
          echo "${OPENCODE_SHA256}  /tmp/opencode.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          rm -f /tmp/opencode.tar.gz
          echo "Installed OpenCode v${OPENCODE_VERSION} (checksum verified)."

      - name: Verify OpenCode install
        if: steps.check.outputs.has_key == 'true'
        run: opencode --version

      - name: Configure review providers
        if: steps.check.outputs.has_key == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # Registers every provider whose API key is configured. opencode.json
          # is fully rewritten here; the review step only switches --model.
          python3 <<'EOF'
          import json, os

          providers = {}
          if os.environ.get("ZAI_API_KEY"):
              coding_model = os.environ["OPENCODE_MODEL"].split("/", 1)[1]
              providers["zai-coding-plan"] = {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Z.AI GLM Coding Plan",
                  "options": {
                      "baseURL": "https://api.z.ai/api/coding/paas/v4",
                      "apiKey": "{env:ZAI_API_KEY}",
                  },
                  "models": {coding_model: {"name": coding_model}},
              }
              providers["zai-standard"] = {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Z.AI Standard API",
                  "options": {
                      "baseURL": "https://api.z.ai/api/paas/v4",
                      "apiKey": "{env:ZAI_API_KEY}",
                  },
                  "models": {
                      os.environ["ZAI_FREE_MODEL"]: {"name": os.environ["ZAI_FREE_MODEL"]}
                  },
              }
          if os.environ.get("OPENROUTER_API_KEY"):
              free_model = os.environ["OPENROUTER_FREE_MODEL"]
              paid_model = os.environ["OPENROUTER_MODEL"]
              providers["openrouter"] = {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "OpenRouter",
                  "options": {
                      "baseURL": "https://openrouter.ai/api/v1",
                      "apiKey": "{env:OPENROUTER_API_KEY}",
                  },
                  "models": {
                      free_model: {"name": free_model},
                      paid_model: {"name": paid_model},
                  },
              }
          config = {
              "$schema": "https://opencode.ai/config.json",
              "provider": providers,
          }
          with open("opencode.json", "w") as f:
              json.dump(config, f, indent=2)
          print("wrote opencode.json with providers:", ", ".join(providers))
          EOF

      - name: Collect PR diff
        if: steps.check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Real secrets are never committed (see AGENTS.md env policy).
          # Scrub any .env / key material from the working tree before the
          # agent runs, in case one was left behind accidentally.
          find . -path ./.git -prune -o -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) -exec rm -f {} +
          find . -path ./.git -prune -o -type d \( -name secrets -o -name private \) -prune -exec rm -rf {} +
          gh pr diff "$PR_NUMBER" --patch > pr.diff
          # Keep the diff within a sane size for the model context.
          MAX_BYTES=200000
          SIZE=$(wc -c < pr.diff)
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" pr.diff > pr.diff.truncated
            printf '\n\n[... diff truncated at %s bytes ...]\n' "$MAX_BYTES" >> pr.diff.truncated
            mv pr.diff.truncated pr.diff
          fi
          wc -c pr.diff

      - name: Run OpenCode review with fallbacks
        if: steps.check.outputs.has_key == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # PR title/number are attacker-controlled; they reach this script
          # only as environment variables (never interpolated by GitHub) so
          # they cannot break out of the shell.
          {
            printf 'You are reviewing GitHub pull request #%s: "%s".\n' "$PR_NUMBER" "$PR_TITLE"
            cat <<'EOF'
          A unified diff of the PR is attached to this message.

          Rules:
          - This is a READ-ONLY review. Do not modify, create, or delete any files. Do not run any command that changes state.
          - Write the entire review in English.
          - NEVER read, open, or quote `.env*`, `*.pem`, `*.key` files, or `**/secrets/**` / `**/private/**` paths.
          - Focus on: real bugs, security issues (especially secret leakage into logs, error messages, or client bundles), broken error handling, and type-safety violations (this repo forbids `any` and requires strict TypeScript).
          - This is a TDD repo: flag new or changed production logic that ships without test coverage.
          - Be concrete: file paths with line numbers, why it matters, and a suggested fix. Skip style nits.
          - Rate each finding as CRITICAL, MAJOR, or MINOR. If nothing material is wrong, say so briefly instead of inventing issues.
          - Output ONLY the review as markdown, with no preamble about your process.
          EOF
          } > prompt.md
          # One review attempt: runs opencode with the given provider/model id
          # and succeeds only if it produces a non-empty review.
          review_with_model() {
            timeout 12m opencode run \
              --model "$1" \
              --file pr.diff \
              --title "PR #$PR_NUMBER review" \
              "$(cat prompt.md)" > review.md
            [ -s review.md ]
          }
          # Attempt order (first success wins): OpenRouter free router ->
          # z.ai standard (glm-4.7-flash) -> z.ai Coding Plan ->
          # OpenRouter auto router. Each tier is tried only when its API key
          # is configured, so the review still runs with just one key set.
          attempts=()
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            attempts+=("openrouter/$OPENROUTER_FREE_MODEL")
          fi
          if [ -n "${ZAI_API_KEY:-}" ]; then
            attempts+=("zai-standard/$ZAI_FREE_MODEL" "$OPENCODE_MODEL")
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            attempts+=("openrouter/$OPENROUTER_MODEL")
          fi
          success=false
          for attempt in "${attempts[@]}"; do
            echo "Attempting review with $attempt ..."
            if review_with_model "$attempt"; then
              echo "Review completed with $attempt."
              success=true
              break
            fi
            echo "Review with $attempt failed; trying the next fallback."
          done
          if [ "$success" != "true" ]; then
            echo "OpenCode produced no output from any endpoint" >&2
            exit 1
          fi
          wc -c review.md

      - name: Scrub secrets from review output
        if: steps.check.outputs.has_key == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # Prompt-injection guard: the review is LLM output over
          # attacker-controlled PR title/diff. Mask both keys in all
          # subsequent logs, then scrub any occurrence of either key value
          # from review.md before it becomes a permanent public PR comment.
          echo "::add-mask::${ZAI_API_KEY}"
          echo "::add-mask::${OPENROUTER_API_KEY}"
          python3 - <<'EOF'
          import os
          path = "review.md"
          text = open(path, encoding="utf-8").read()
          scrubbed = False
          for var in ("ZAI_API_KEY", "OPENROUTER_API_KEY"):
              key = os.environ.get(var, "")
              if key and key in text:
                  text = text.replace(key, "***REDACTED***")
                  scrubbed = True
          if scrubbed:
              open(path, "w", encoding="utf-8").write(text)
              print("scrubbed secret occurrence from review.md")
          else:
              print("no secret material found in review.md")
          EOF

      - name: Post review as a new PR comment
        if: steps.check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          HEAD_SHORT="${HEAD_SHA:0:7}"
          MARKER="<!-- opencode-review -->"
          # A new comment per push (never updated in place): each review round
          # stays visible as its own comment, with the head SHA in the header
          # so it is clear which push the review covers.
          {
            echo "$MARKER"
            echo "## OpenCode review — ${HEAD_SHORT}"
            echo ""
            cat review.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
          echo "Posted new review comment for ${HEAD_SHORT}"
