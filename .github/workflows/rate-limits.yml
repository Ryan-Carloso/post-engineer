name: rate-limits

# Every exported route handler under apps/web/app must reach applyRateLimit
# (directly, through a same-file helper, or by passing a RATE_LIMITS profile
# to a helper). A handler that intentionally has no limit needs a typed entry
# in .github/scripts/rate-limits/allowlist.json: a known exemption kind and a
# written reason. A stale entry (the handler is limited now) or an entry for
# a handler that no longer exists also fails.
#
# The scanner uses the TypeScript compiler API from apps/web's node_modules,
# so the job installs the workspace.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-09-25
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (rate-limits lint)
        run: node --test .github/scripts/rate-limits/check.test.mjs

      - name: Every route handler is rate limited or allowlisted
        run: node .github/scripts/rate-limits/check.mjs
