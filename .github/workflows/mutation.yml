name: mutation

# Mutation testing per PR: StrykerJS over the vitest suites (web, mcp) and
# mutmut over the engine's pytest suite.
#
# REQUIRED CHECKS — `mutation (web)`, `mutation (mcp)` and `mutation (engine)`
# are required checks in the "main" branch ruleset (user decision,
# 2026-10-05). They fail ONLY on execution errors (the tool crashed, the
# baseline suite failed, ...). There are intentionally NO score thresholds:
# a low mutation score is a signal for the PR author, not a merge blocker.
#
# Design (user decision, 2026-10-04): mutation runs ON EVERY PR, scoped to
# that PR's changed files — a nightly score has no owning PR, so a big PR
# tanking the score would need a whole new PR to fix it; per-PR keeps the
# feedback loop tight. `workflow_dispatch` runs the full configured scope
# (see each app's stryker.config.json / the engine's [tool.mutmut]) for
# manual baselines, or a single folder when the `scope` input is set (a glob
# like `lib/oauth/**`, resolved relative to each app's directory; jobs
# whose app has no matches are skipped).
#
# Scope per PR: changed source files (web/mcp: .ts/.tsx excluding tests;
# engine: app/**/*.py). If a PR touches no source files for an app, that
# app's mutation step is skipped gracefully and the check still succeeds.
#
# Speed (2026-10-08): the engine job is sharded by file — one matrix leg
# per changed file, each on its own runner. mutmut's own incremental
# engine is fed by a per-PR/per-file cache of apps/engine/mutants/, so
# synchronize re-runs only re-test mutants invalidated by source changes.
# Stryker runs incrementally (`incremental: true` + a per-PR cache of the
# incremental file) so synchronize re-runs only re-test changed mutants.
# (Deliberately NOT set: mutmut's `mutate_only_covered_lines` — its extra
# in-process coverage run breaks the subsequent stats collection on
# test_material.py's order-sensitive tests (3/3 local repros); revisit
# after that isolation bug is fixed.)
#
# Results: per-app artifacts (Stryker HTML report / mutmut stats dir) and
# the mutation score in the job summary. The free Stryker dashboard is
# intentionally NOT wired (needs an API key secret); artifacts suffice.

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Optional glob limiting mutation to a single folder, resolved
          relative to the app directory (web/mcp, e.g. 'lib/oauth/**') or
          to apps/engine (e.g. 'app/services/**'). Applies to every job; a
          job whose app has no matches is skipped. Empty keeps the current
          behavior (full configured scope).
        required: false
        default: ''
        type: string

jobs:
  stryker:
    name: mutation (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, mcp]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changed-files diff needs origin/<base>.
          fetch-depth: 0

      # Stryker incremental state. Without this cache, `incremental: true`
      # is a no-op on ephemeral runners — the cache is the point: each
      # synchronize reuses the previous run's results and only re-tests
      # changed mutants. run_id is in the key because actions/cache entries
      # are immutable (re-saving under an existing key is a silent no-op),
      # so every run needs a fresh key; restore-keys picks the latest one
      # from this PR (or from manual dispatches).
      - name: Restore Stryker incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/${{ matrix.app }}/reports/stryker-incremental.json
          key: stryker-inc-${{ matrix.app }}-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          restore-keys: |
            stryker-inc-${{ matrix.app }}-pr-${{ github.event.pull_request.number || 'manual' }}-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changed source files for this app, relative to the app dir
      # (Stryker resolves --mutate against its working directory).
      # Excludes tests and deleted files. Empty when the PR touches no
      # source files in this app — or on manual dispatch (full config
      # scope, or the `scope` input when set; see the run step below).
      - name: Compute changed files
        id: changed
        run: |
          set -uo pipefail
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'apps/${{ matrix.app }}/**/*.ts' 'apps/${{ matrix.app }}/**/*.tsx' \
              | grep -v '/__tests__/' | grep -vE '\.test\.tsx?$' || true)"
            # Strip the app prefix for Stryker's working directory.
            files="$(echo "$files" | sed "s|^apps/${{ matrix.app }}/||" | paste -sd ',' -)"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Mutating changed files: $files"
          else
            echo "No changed source files for ${{ matrix.app }} (or manual dispatch: full config scope)."
          fi

      - name: Run Stryker mutation testing
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.files != ''
        working-directory: apps/${{ matrix.app }}
        run: |
          # Brackets in Next.js route paths ([taskId], [...path]) are
          # minimatch character classes — escape them as [[] / []] so
          # Stryker matches the literal files (same escaping as the
          # ui-coverage-gates job in ci.yml). Stryker's normalizeFileName
          # turns backslashes into slashes, so backslash-escaping cannot
          # work here. Single pass only: a second pass would re-escape the
          # brackets the first pass introduced.
          stryker_files="$(echo "${{ steps.changed.outputs.files }}" | perl -pe 's/(\[|\])/$1 eq "[" ? "[[]" : "[]]"/ge')"
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            pnpm exec stryker run --mutate "$stryker_files"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.scope }}" ]; then
            # Manual scoped run: the glob resolves relative to the app
            # directory. Skip gracefully when it matches nothing here so a
            # folder that exists in only one app keeps the dispatch green.
            shopt -s globstar nullglob
            matches=( ${{ inputs.scope }} )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "Scope '${{ inputs.scope }}' matches no files in ${{ matrix.app }} — skipping."
            else
              echo "Scoped dispatch: mutating '${{ inputs.scope }}' (${#matches[@]} path(s))."
              pnpm exec stryker run --mutate "${{ inputs.scope }}"
            fi
          else
            pnpm exec stryker run
          fi

      - name: Upload mutation HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.app }}-${{ github.event.pull_request.number || 'manual' }}
          path: apps/${{ matrix.app }}/reports/mutation/
          if-no-files-found: ignore

      - name: Mutation score summary
        if: always()
        run: |
          set -uo pipefail
          JSON="apps/${{ matrix.app }}/reports/mutation/mutation.json"
          {
            echo "## Mutation testing — ${{ matrix.app }}"
            echo ""
            if [ -f "$JSON" ]; then
              read -r SCORE KILLED SURVIVED TIMEOUT TOTAL <<< "$(
                jq -r '
                  [.files[].mutants[]] as $m
                  | ($m | length) as $total
                  | ($m | map(select(.status == "Killed")) | length) as $killed
                  | ($m | map(select(.status == "Survived")) | length) as $survived
                  | ($m | map(select(.status == "Timeout")) | length) as $timeout
                  | if $total == 0 then "n/a 0 0 0 0"
                    else "\((($killed + $timeout) * 100 / $total) | floor) \($killed) \($survived) \($timeout) \($total)"
                    end
                ' "$JSON"
              )"
              echo "**Mutation score: ${SCORE}%** (${KILLED} killed, ${SURVIVED} survived, ${TIMEOUT} timed out, ${TOTAL} mutants)"
            else
              echo "No mutation report produced — no source files changed, or the run failed."
            fi
            echo ""
            echo "Full HTML report: download the \`mutation-report-${{ matrix.app }}-\` artifact from this run."
          } >> "$GITHUB_STEP_SUMMARY"

  # Python mutation testing for the engine (mutmut 3.x over pytest).
  #
  # Sharded by file: one matrix leg per changed file, so a PR touching N
  # files gets N parallel runners instead of one runner grinding through
  # every mutant sequentially. Each leg is a fresh VM, so the per-leg
  # pyproject.toml patch below cannot collide across legs (same reasoning
  # as the PR #104 calibration note in AGENTS.md). Jobs beyond the
  # account's concurrency limit simply queue.
  #
  # The statically-named `mutation (engine)` aggregator at the end is what
  # the branch ruleset's required check matches: matrix legs render as
  # "mutation (engine shard) (<file>)" and can never satisfy an exact-name
  # required check, so without the aggregator a required "mutation
  # (engine)" would block every PR forever.
  mutation-engine-changes:
    name: mutation (engine) / changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_json: ${{ steps.changed.outputs.files_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changed-files diff needs origin/<base>.
          fetch-depth: 0

      # Changed engine source files as a JSON array, relative to
      # apps/engine (mutmut's working directory). Excludes deleted files.
      # - PR: the PR's changed files; [] when the PR touches no engine
      #   source, and the shard job below skips gracefully.
      # - Manual dispatch with a scope input: the glob expanded relative
      #   to apps/engine; [] when it matches nothing (skip gracefully).
      # - Manual dispatch without scope: [""] — a single shard whose empty
      #   file means "full app/ scope, don't pin only_mutate".
      - name: Compute engine files to mutate
        id: changed
        run: |
          set -uo pipefail
          files_json="[]"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files_json="$(git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'apps/engine/app/**/*.py' \
              | sed 's|^apps/engine/||' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.scope }}" ]; then
              cd apps/engine || exit 1
              shopt -s globstar nullglob
              matches=( ${{ inputs.scope }} )
              files_json="$(printf '%s\n' "${matches[@]}" \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            else
              files_json='[""]'
            fi
          fi
          echo "files_json=$files_json" >> "$GITHUB_OUTPUT"
          echo "Engine files to mutate: $files_json"

  mutation-engine-shard:
    # Display names render as e.g. "mutation (engine shard)
    # (app/services/task.py)".
    name: mutation (engine shard)
    needs: [mutation-engine-changes]
    if: needs.mutation-engine-changes.outputs.files_json != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.mutation-engine-changes.outputs.files_json) }}
    defaults:
      run:
        working-directory: apps/engine

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: not strictly needed per shard, kept for parity
          # with the other jobs.
          fetch-depth: 0

      # Artifact names containing '/' restore as nested directories —
      # flatten them so each shard's report (and cache key) uses one
      # flat slug.
      - name: Compute shard slug
        id: slug
        run: |
          file="${{ matrix.file }}"
          if [ -z "$file" ]; then
            slug="full"
          else
            slug="${file//\//-}"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # mutmut's incremental engine: with a previous mutants/ state dir
      # (.meta verdicts + mutmut-stats.json), only mutants invalidated by
      # source/config changes are re-tested — no flag needed. Ephemeral
      # runners rebuild mutants/ from scratch every run, so without this
      # cache the incremental path never kicks in. Namespaced per PR and
      # per file: each shard only ever mutates its own file, so caches
      # must not mix. run_id is in the key because cache entries are
      # immutable (re-saving under an existing key is a silent no-op).
      - name: Restore mutmut incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/engine/mutants/
          key: mutmut-${{ steps.slug.outputs.slug }}-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          restore-keys: |
            mutmut-${{ steps.slug.outputs.slug }}-pr-${{ github.event.pull_request.number || 'manual' }}-

      # Runtime artifacts from a previous run are not part of mutmut's
      # incremental state — drop them so no test ever observes another
      # run's leftovers.
      - name: Prune ephemeral artifacts from restored cache
        run: |
          rm -rf mutants/storage mutants/.pytest_cache

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: latest

      - name: Sync dependencies
        run: uv sync --frozen

      # mutmut 3.x reads its config only from pyproject.toml — there is no
      # CLI flag to override the mutated file set. Patch only_mutate in
      # place on the ephemeral runner (never committed). An empty matrix
      # file means full app/ scope (manual dispatch without a scope
      # input): leave only_mutate untouched.
      - name: Scope mutmut to this shard's file
        if: matrix.file != ''
        env:
          SHARD_FILE: ${{ matrix.file }}
        run: |
          uv run python - <<'EOF'
          import os
          import re

          shard_file = os.environ["SHARD_FILE"]
          p = "pyproject.toml"
          s = open(p).read()
          idx = s.index("[tool.mutmut]")
          head, tail = s[:idx], s[idx:]
          tail = re.sub(
              r"only_mutate = \[[^\]]*\]",
              f'only_mutate = [\n    "{shard_file}",\n]',
              tail,
              count=1,
          )
          open(p, "w").write(head + tail)
          print(f"only_mutate set to [{shard_file}]")
          EOF

      # mutmut 3.x only instruments function bodies: a shard file with no
      # function definitions (e.g. a pure constants module) produces zero
      # mutants, and `mutmut run` exits 1 ("Stopping early, because we could
      # not find any test case for any mutant") — which is not a failure.
      # Detect that case up front so the shard skips gracefully instead.
      - name: Check shard file has mutable code
        if: matrix.file != ''
        id: mutable
        env:
          SHARD_FILE: ${{ matrix.file }}
        run: |
          uv run python - <<'EOF'
          import ast
          import os

          path = os.environ["SHARD_FILE"]
          tree = ast.parse(open(path).read())
          has_functions = any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              for node in ast.walk(tree)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_functions={'true' if has_functions else 'false'}\n")
          print(f"{path}: has_functions={has_functions}")
          EOF

      - name: Run mutmut mutation testing
        if: matrix.file == '' || steps.mutable.outputs.has_functions == 'true'
        run: uv run mutmut run

      - name: Report skipped shard
        if: matrix.file != '' && steps.mutable.outputs.has_functions == 'false'
        run: |
          echo "No function definitions in ${{ matrix.file }} — nothing for mutmut to mutate, shard skipped."

      - name: Export CI/CD stats
        if: always()
        run: |
          if [ -d mutants ]; then
            uv run mutmut export-cicd-stats
          fi

      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-engine-${{ github.event.pull_request.number || 'manual' }}-${{ steps.slug.outputs.slug }}
          path: apps/engine/mutants/
          if-no-files-found: ignore

      - name: Mutation score summary
        if: always()
        run: |
          set -uo pipefail
          label="${{ matrix.file }}"
          if [ -z "$label" ]; then label="full scope"; fi
          {
            echo "## Mutation testing — engine ($label)"
            echo ""
            STATS="mutants/mutmut-cicd-stats.json"
            if [ -f "$STATS" ]; then
              read -r SCORE KILLED SURVIVED TIMEOUT TOTAL <<< "$(
                uv run python -c "
          import json
          d = json.load(open('$STATS'))
          total = d['total']
          killed = d['killed']
          survived = d['survived']
          timeout = d.get('timeout', 0)
          score = (killed + timeout) * 100 // total if total else 'n/a'
          print(score, killed, survived, timeout, total)
          "
              )"
              echo "**Mutation score: ${SCORE}%** (${KILLED} killed, ${SURVIVED} survived, ${TIMEOUT} timed out, ${TOTAL} mutants)"
            else
              if [ "${{ steps.mutable.outputs.has_functions }}" = "false" ]; then
                echo "Shard skipped: no function definitions in $label, nothing for mutmut to mutate."
              else
                echo "No mutation report produced for $label — the run failed."
              fi
            fi
            echo ""
            echo "Full report: download the \`mutation-report-engine-\` artifact for this shard from this run."
          } >> "$GITHUB_STEP_SUMMARY"

  # Single, statically-named gate: the branch ruleset's required check
  # "mutation (engine)" matches this job's one check run.
  mutation-engine:
    name: mutation (engine)
    needs: [mutation-engine-changes, mutation-engine-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate shard results
        run: |
          changes="${{ needs.mutation-engine-changes.result }}"
          shards="${{ needs.mutation-engine-shard.result }}"
          echo "changed-files job: $changes; shard jobs: $shards"
          if [ "$changes" != "success" ]; then
            echo "::error::changed-files computation did not succeed ($changes)"
            exit 1
          fi
          case "$shards" in
            success|skipped)
              echo "mutation (engine): $shards — no shard failures."
              ;;
            *)
              echo "::error::mutation shards ended as '$shards'"
              exit 1
              ;;
          esac
