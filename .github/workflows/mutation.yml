name: mutation

# Mutation testing per PR: StrykerJS over the vitest suites (web, mcp).
#
# REQUIRED CHECKS — `mutation (web)` and `mutation (mcp)` are required checks in the "main" branch ruleset (user decision,
# 2026-10-05). They fail ONLY on execution errors (the tool crashed, the
# baseline suite failed, ...). There are intentionally NO score thresholds:
# a low mutation score is a signal for the PR author, not a merge blocker.
#
# Design (user decision, 2026-10-04): mutation runs ON EVERY PR, scoped to
# that PR's changed files — a nightly score has no owning PR, so a big PR
# tanking the score would need a whole new PR to fix it; per-PR keeps the
# feedback loop tight. `workflow_dispatch` runs the full configured scope
# (see each app's stryker.config.json) for manual baselines, or a single folder when the `scope` input is set (a glob
# like `lib/oauth/**`, resolved relative to each app's directory; jobs
# whose app has no matches are skipped).
#
# Scope per PR: changed source files (web/mcp: .ts/.tsx excluding tests,
# Cypress specs, and the cypress/ directory). If a PR touches no source,
# the mutation step is skipped gracefully and the check still succeeds.
#
# Stryker runs incrementally (`incremental: true` + a per-PR cache of the
# incremental file) so synchronize re-runs only re-test changed mutants.
#
# The web/mcp Stryker runs are scoped to the PR's
# CHANGED LINE RANGES (native `path:startLine-endLine` mutate syntax;
# extractor: .github/scripts/ui-gates/changed-ranges.mjs, tested there).
# New files and fallbacks (unparseable hunk, >maxRanges, extractor
# error, zero mutants selected) mutate the whole file — the scope only
# ever widens, so verdicts can only get stricter. Dispatch keeps the
# full configured scope. The Stryker incremental cache is unaffected:
# the per-mutant results it stores stay valid across synchronize runs.
# The ui-coverage-gates mutation gate (ci.yml) reads its score over the
# mutants the report carries — with line scoping that is exactly the
# PR's changed lines' mutants, so "mutation ≥ 60% on changed UI files"
# keeps meaning the changed code.
#
# Results: per-app artifacts (Stryker HTML report / mutmut stats dir) and
# the mutation score in the job summary. The free Stryker dashboard is
# intentionally NOT wired (needs an API key secret); artifacts suffice.

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Optional glob limiting mutation to a single folder, resolved
          relative to the app directory (web/mcp, e.g. 'lib/oauth/**').
          Applies to every job; a job whose app has no matches is skipped. Empty keeps the current
          behavior (full configured scope).
        required: false
        default: ''
        type: string

jobs:
  stryker:
    name: mutation (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, mcp]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changed-files diff needs origin/<base>.
          fetch-depth: 0

      # Stryker incremental state. Without this cache, `incremental: true`
      # is a no-op on ephemeral runners — the cache is the point: each
      # synchronize reuses the previous run's results and only re-tests
      # changed mutants. run_id is in the key because actions/cache entries
      # are immutable (re-saving under an existing key is a silent no-op),
      # so every run needs a fresh key; restore-keys picks the latest one
      # from this PR (or from manual dispatches).
      - name: Restore Stryker incremental state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/${{ matrix.app }}/reports/stryker-incremental.json
          key: stryker-inc-${{ matrix.app }}-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          restore-keys: |
            stryker-inc-${{ matrix.app }}-pr-${{ github.event.pull_request.number || 'manual' }}-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app imports the MCP package (workspace:*) for the hosted
      # /mcp route (issue #561): Stryker runs vitest/tsc directly (no
      # prebuild), and they resolve it through apps/mcp/dist — build it
      # first. Harmless for the mcp matrix app (its own dist).
      - name: Build MCP package
        run: pnpm --filter post-engineer-mcp build

      # Changed source files for this app, relative to the app dir
      # (Stryker resolves --mutate against its working directory).
      # Excludes tests, generated *.gen.ts files (drift-tested, often
      # type-only: no mutants) and deleted files. Empty when the PR touches no
      # source files in this app — or on manual dispatch (full config
      # scope, or the `scope` input when set; see the run step below).
      - name: Compute changed files
        id: changed
        run: |
          set -uo pipefail
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'apps/${{ matrix.app }}/**/*.ts' 'apps/${{ matrix.app }}/**/*.tsx' \
              | grep -v '/__tests__/' | grep -v '/cypress/' \
              | grep -vE '\.(test|cy)\.tsx?$' | grep -vE '\.gen\.tsx?$' || true)"
            # Drop files whose code tokens match the base (comment-only
            # changes produce the same mutants as main). On any filter
            # error, keep the unfiltered list: the scope only widens.
            if [ -n "$files" ]; then
              filtered="$(printf '%s\n' "$files" | node .github/scripts/ui-gates/code-changed.mjs \
                --base "origin/${{ github.base_ref }}" --head HEAD)" && files="$filtered"
            fi
            # Strip the app prefix for Stryker's working directory.
            files="$(echo "$files" | sed "s|^apps/${{ matrix.app }}/||" | paste -sd ',' -)"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Mutating changed files: $files"
          else
            echo "No changed source files for ${{ matrix.app }} (or manual dispatch: full config scope)."
          fi

      # Speed (2026-10-24): on PRs, Stryker mutates ONLY the PR's changed
      # LINE RANGES (native `path:startLine-endLine` mutate syntax). The
      # extractor is
      # .github/scripts/ui-gates/changed-ranges.mjs (tested there);
      # fallbacks (new file, unparseable hunk, >maxRanges, script error)
      # mutate the whole file, so the scope only ever widens, never
      # weakens. Dispatch runs keep the full configured scope.
      - name: Compute changed line ranges
        id: ranges
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/ui-gates/changed-ranges.mjs"
          [ -f "$SCRIPT" ] || { echo "::error::extractor script not found at $SCRIPT"; exit 1; }
          mutate="$(node "$SCRIPT" --app "${{ matrix.app }}" --base "origin/$BASE_REF" --head HEAD || true)"
          echo "mutate=$mutate" >> "$GITHUB_OUTPUT"
          if [ -n "$mutate" ]; then
            echo "Mutating changed line ranges: $mutate"
          else
            echo "No line ranges extracted — the run step falls back to whole changed files."
          fi

      - name: Run Stryker mutation testing
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.files != ''
        working-directory: apps/${{ matrix.app }}
        env:
          # PR-controlled patterns (paths/line ranges) pass through env
          # vars, never inline ${{ }} interpolation — filenames can carry
          # spaces, $ or backticks.
          MUTATE_GLOBS: ${{ steps.ranges.outputs.mutate }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          if [ -n "$MUTATE_GLOBS" ]; then
            echo "Mutating the PR's changed line ranges: $MUTATE_GLOBS"
            {
              echo "## Stryker line-scoped patterns (${{ matrix.app }})"
              echo ""
              echo '```'
              echo "$MUTATE_GLOBS"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            # Stryker's --mutate takes ONE comma-separated argument: a
            # space-separated list is treated as a single glob pattern
            # matching nothing, which fails the scoped run and forces the
            # whole-file fallback (on this PR: 2627 mutants, ~19h estimate,
            # killed by the 3h job timeout). changed-ranges.mjs emits
            # space-separated patterns, so comma-join them here — with NO
            # space after the comma, because Stryker splits on commas and
            # a leading space makes every later glob match nothing (a
            # previous attempt with ', ' passed vacuously with 0 mutants).
            # The fallback below already passes comma-joined files.
            if pnpm exec stryker run --mutate "${MUTATE_GLOBS// /,}"; then
              exit 0
            fi
            echo "::warning::line-scoped run failed — falling back to whole changed files"
          fi
          if [ -z "$CHANGED_FILES" ]; then
            if [ -n "$GITHUB_BASE_REF" ]; then
              echo "No changed source files — nothing to mutate."
              exit 0
            fi
          fi
          # Brackets in Next.js route paths ([taskId], [...path]) are
          # minimatch character classes — escape them as [[] / []] so
          # Stryker matches the literal files (same escaping as the
          # ui-coverage-gates job in ci.yml). Stryker's normalizeFileName
          # turns backslashes into slashes, so backslash-escaping cannot
          # work here. Single pass only: a second pass would re-escape the
          # brackets the first pass introduced.
          stryker_files="$(echo "$CHANGED_FILES" | perl -pe 's/(\[|\])/$1 eq "[" ? "[[]" : "[]]"/ge')"
          if [ -n "$CHANGED_FILES" ]; then
            echo "Mutating whole changed files (fallback)."
            pnpm exec stryker run --mutate "$stryker_files"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.scope }}" ]; then
            # Manual scoped run: the glob resolves relative to the app
            # directory. Skip gracefully when it matches nothing here so a
            # folder that exists in only one app keeps the dispatch green.
            shopt -s globstar nullglob
            matches=( ${{ inputs.scope }} )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "Scope '${{ inputs.scope }}' matches no files in ${{ matrix.app }} — skipping."
            else
              echo "Scoped dispatch: mutating '${{ inputs.scope }}' (${#matches[@]} path(s))."
              pnpm exec stryker run --mutate "${{ inputs.scope }}"
            fi
          else
            pnpm exec stryker run
          fi

      - name: Upload mutation HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.app }}-${{ github.event.pull_request.number || 'manual' }}
          path: apps/${{ matrix.app }}/reports/mutation/
          if-no-files-found: ignore

      - name: Mutation score summary
        if: always()
        run: |
          set -uo pipefail
          JSON="apps/${{ matrix.app }}/reports/mutation/mutation.json"
          {
            echo "## Mutation testing — ${{ matrix.app }}"
            echo ""
            if [ -f "$JSON" ]; then
              read -r SCORE KILLED SURVIVED TIMEOUT TOTAL <<< "$(
                jq -r '
                  [.files[].mutants[]] as $m
                  | ($m | length) as $total
                  | ($m | map(select(.status == "Killed")) | length) as $killed
                  | ($m | map(select(.status == "Survived")) | length) as $survived
                  | ($m | map(select(.status == "Timeout")) | length) as $timeout
                  | if $total == 0 then "n/a 0 0 0 0"
                    else "\((($killed + $timeout) * 100 / $total) | floor) \($killed) \($survived) \($timeout) \($total)"
                    end
                ' "$JSON"
              )"
              echo "**Mutation score: ${SCORE}%** (${KILLED} killed, ${SURVIVED} survived, ${TIMEOUT} timed out, ${TOTAL} mutants)"
            else
              echo "No mutation report produced — no source files changed, or the run failed."
            fi
            echo ""
            echo "Full HTML report: download the \`mutation-report-${{ matrix.app }}-\` artifact from this run."
          } >> "$GITHUB_STEP_SUMMARY"
