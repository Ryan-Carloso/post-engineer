name: mutation

# Mutation testing (StrykerJS) over the vitest suites.
#
# INFORMATIONAL ONLY — this workflow is deliberately NOT a required check and
# must never be added to the branch ruleset: it runs `continue-on-error` and
# must never block PRs or merges.
#
# Design (user decision, 2026-10-04): mutation runs ON EVERY PR, scoped to
# that PR's changed files — a nightly score has no owning PR, so a big PR
# tanking the score would need a whole new PR to fix it; per-PR keeps the
# feedback loop tight. `workflow_dispatch` runs the full configured scope
# (see each app's stryker.config.json) for manual baselines.
#
# Scope per PR: changed .ts/.tsx files under apps/web and apps/mcp,
# excluding tests. If a PR touches no source files, the Stryker step is
# skipped gracefully.
# apps/engine (Python) is out of scope here — needs mutmut/Cosmic Ray in a
# follow-up.
#
# Results: the HTML report is uploaded as a per-app artifact and the
# mutation score is printed in the job summary. The free Stryker dashboard
# is intentionally NOT wired (needs an API key secret); artifacts suffice.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/web/**/*.ts'
      - 'apps/web/**/*.tsx'
      - 'apps/mcp/**/*.ts'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

jobs:
  stryker:
    name: mutation (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, mcp]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changed-files diff needs origin/<base>.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changed source files for this app, relative to the app dir
      # (Stryker resolves --mutate against its working directory).
      # Excludes tests and deleted files. Empty when the PR touches no
      # source files in this app — or on manual dispatch (full scope).
      - name: Compute changed files
        id: changed
        run: |
          set -uo pipefail
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'apps/${{ matrix.app }}/**/*.ts' 'apps/${{ matrix.app }}/**/*.tsx' \
              | grep -v '/__tests__/' | grep -vE '\.test\.tsx?$' || true)"
            # Strip the app prefix for Stryker's working directory.
            files="$(echo "$files" | sed "s|^apps/${{ matrix.app }}/||" | paste -sd ',' -)"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Mutating changed files: $files"
          else
            echo "No changed source files for ${{ matrix.app }} (or manual dispatch: full config scope)."
          fi

      - name: Run Stryker mutation testing
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.files != ''
        working-directory: apps/${{ matrix.app }}
        # Informational only: never fail the PR on mutation results.
        continue-on-error: true
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            pnpm exec stryker run --mutate "${{ steps.changed.outputs.files }}"
          else
            pnpm exec stryker run
          fi

      - name: Upload mutation HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.app }}-${{ github.event.pull_request.number || 'manual' }}
          path: apps/${{ matrix.app }}/reports/mutation/
          if-no-files-found: ignore

      - name: Mutation score summary
        if: always()
        run: |
          set -uo pipefail
          JSON="apps/${{ matrix.app }}/reports/mutation/mutation.json"
          {
            echo "## Mutation testing — ${{ matrix.app }}"
            echo ""
            if [ -f "$JSON" ]; then
              read -r SCORE KILLED SURVIVED TIMEOUT TOTAL <<< "$(
                jq -r '
                  [.files[].mutants[]] as $m
                  | ($m | length) as $total
                  | ($m | map(select(.status == "Killed")) | length) as $killed
                  | ($m | map(select(.status == "Survived")) | length) as $survived
                  | ($m | map(select(.status == "Timeout")) | length) as $timeout
                  | if $total == 0 then "n/a 0 0 0 0"
                    else "\((($killed + $timeout) * 100 / $total) | floor) \($killed) \($survived) \($timeout) \($total)"
                    end
                ' "$JSON"
              )"
              echo "**Mutation score: ${SCORE}%** (${KILLED} killed, ${SURVIVED} survived, ${TIMEOUT} timed out, ${TOTAL} mutants)"
            else
              echo "No mutation report produced — no source files changed, or the run failed."
            fi
            echo ""
            echo "Full HTML report: download the \`mutation-report-${{ matrix.app }}-\` artifact from this run."
          } >> "$GITHUB_STEP_SUMMARY"
