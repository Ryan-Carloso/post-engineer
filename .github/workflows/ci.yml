name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regression gate for the review-workflow files (opencode-review.yml
  # and its validator). This job checks out the PR's
  # own merge ref, so a commit that relaxes both a workflow and its
  # validator passes the gate by construction — the gate is
  # accidental-regression protection, NOT tamper-resistance. The remote
  # opencode-review is the adversarial layer: any such
  # relaxation shows up as a reviewed diff before merge.
  review-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-09-25
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-validator.txt'

      - name: Install validator dependencies
        run: |
          set -euo pipefail
          pip install --quiet -r .github/scripts/requirements-validator.txt

      - name: Validate review workflows
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-opencode-review.py

      - name: Unit-test review scripts
        run: |
          set -euo pipefail
          pip install --quiet pytest
          python3 -m pytest .github/scripts/tests -q

  # Fails if secret-bearing files are tracked in git. config.toml may hold
  # provider API keys and real .env files must never be committed (see the
  # env-files policy in AGENTS.md).
  secrets-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - name: Fail if secret-bearing files are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -qx 'apps/engine/config.toml'; then
            echo "::error::apps/engine/config.toml is tracked in git. Untrack it: git rm --cached apps/engine/config.toml"
            exit 1
          fi
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Real .env files are tracked in git:"
            echo "$tracked_env"
            exit 1
          fi
          echo "secrets hygiene OK: no secret-bearing files tracked"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata: VERSION from the repo-root VERSION file (manual
      # SemVer), BUILD from the CI run number (unique per run, never
      # random), COMMIT from the short SHA. Exported to every later step;
      # next.config.ts inlines them into the bundle at `pnpm build`.
      # Nothing version-related is committed to git — parallel PRs never
      # conflict on version files; each CI run generates its own build.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Unit tests
        # NOTE: pass flags via `pnpm exec vitest` — `pnpm test -- --coverage`
        # forwards a literal `--` to the script (pnpm 10), which makes vitest
        # silently skip coverage generation (no report files written).
        run: pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=cobertura

      # Production build check. Vercel preview builds used to be the only
      # `next build` verification in CI; now that deploys target our own VPS,
      # the build runs here with dummy build-time env (NEXT_PUBLIC_* values
      # are inlined at build time; dummies are enough to prove it compiles).
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_POSTHOG_HOST: https://example.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY: dummy-posthog-key
          NEXT_PUBLIC_WHATSAPP_NUMBER: "000000000000"
        run: pnpm build

      # Codecov is the coverage gate (GitHub's native coverage needs a paid
      # plan): fail the job if the upload fails so a silent miss can never
      # bypass the codecov/project and codecov/patch status checks.
      # Tokenless upload works because the repo is public; a CODECOV_TOKEN
      # secret can be added later for higher rate limits.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/web/coverage-unit/cobertura-coverage.xml
          flags: web
          fail_ci_if_error: true
          verbose: true

      # The ui-coverage-gates job (below) aggregates this report over the
      # PR's changed UI files.
      - name: Upload vitest coverage for UI gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-vitest
          path: apps/web/coverage-unit/cobertura-coverage.xml
          if-no-files-found: warn
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec nx run mcp:typecheck

      - name: Unit tests
        # NOTE: pass flags via `pnpm exec vitest` — `pnpm test -- --coverage`
        # forwards a literal `--` to the script (pnpm 10), which makes vitest
        # silently skip coverage generation (no report files written).
        run: pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=cobertura

      # Codecov is the coverage gate (GitHub's native coverage needs a paid
      # plan): fail the job if the upload fails so a silent miss can never
      # bypass the codecov/project and codecov/patch status checks.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/mcp/coverage/cobertura-coverage.xml
          flags: mcp
          fail_ci_if_error: true
          verbose: true

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata (same contract as the web job): exported so the
      # engine test suite exercises the injected-VERSION/BUILD/COMMIT path
      # that /version and /health report in production.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: latest

      - name: Lockfile freshness (fail if uv.lock is stale vs pyproject.toml)
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app cli.py test

      - name: Typecheck
        run: uv run python -m compileall -q app cli.py main.py

      - name: Mypy (import-not-found fatal, selected codes disabled)
        run: uv run mypy app cli.py main.py

      - name: Import smoke test (catches ModuleNotFoundError from removed deps)
        run: uv run python -c "import cli, main; from app import asgi; print('imports OK')"

      - name: Tests
        run: uv run coverage run -m pytest -q && uv run coverage xml -o coverage.xml

      # Codecov is the coverage gate (GitHub's native coverage needs a paid
      # plan): fail the job if the upload fails so a silent miss can never
      # bypass the codecov/project and codecov/patch status checks.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/engine/coverage.xml
          flags: engine
          fail_ci_if_error: true
          verbose: true

  # Full Cypress E2E suite (cypress/e2e/**): real Next.js server, real
  # Supabase session (the middleware validates the cookie server-side, so
  # intercepts alone cannot authenticate), network-level mocks only for
  # what cannot run in CI (social OAuth, engine task polling).
  #
  # Required repository secrets (Settings > Secrets > Actions):
  #   NEXT_PUBLIC_SUPABASE_URL      — Supabase project URL (public value)
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY — Supabase anon key (public value)
  #   CYPRESS_E2E_TEST_EMAIL        — login of the dedicated E2E test user
  #   CYPRESS_E2E_TEST_PASSWORD     — password of the dedicated E2E test user
  # The Supabase pair is named after the app variables it feeds (the gate
  # below checks those names, so a CYPRESS_-prefixed secret would report as
  # an empty NEXT_PUBLIC_* var). The credentials keep the CYPRESS_ prefix and
  # are re-exported below as E2E_TEST_* because that is what
  # cypress.config.ts reads via loadEnvConfig — the CI runner has no .env.
  # The E2E user must exist in the Supabase project; specs must mock every
  # mutating API call (cy.intercept) so CI never writes production data.
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.CYPRESS_E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.CYPRESS_E2E_TEST_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://localhost:3434
      NEXT_PUBLIC_POSTHOG_HOST: https://example.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: dummy-posthog-key
      NEXT_PUBLIC_WHATSAPP_NUMBER: "000000000000"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata (same contract as the web job): the Cypress
      # production build inlines the same VERSION/BUILD/COMMIT the unit
      # job verified.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Check E2E secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Repository secret $var is not set (Settings > Secrets > Actions). The Cypress job needs it."
              missing=1
            fi
          done
          for var in E2E_TEST_EMAIL E2E_TEST_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set — is the repository secret CYPRESS_${var#E2E_TEST_} configured (Settings > Secrets > Actions)? The Cypress job needs it."
              missing=1
            fi
          done
          exit $missing

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries for Cypress's bundled Electron (Ubuntu 24.04).
      - name: Install Cypress system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev \
            libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Production build
        run: pnpm build

      - name: Start app server
        shell: bash
        run: |
          set -euo pipefail
          # pnpm 10 forwards a literal `--` to the script, so `pnpm start -- -p 3434`
          # reaches Next as `next start -- -p 3434` and it reads `-p` as a project
          # directory. Invoke the binary directly.
          (pnpm exec next start -p 3434 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3434/; then
              echo "server up after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Next.js server did not start on :3434"
          tail -50 /tmp/next-start.log || true
          exit 1

      # Credentials come from the job-level env (E2E_TEST_*, the names
      # cypress.config.ts reads), so no step-level env is needed here.
      - name: Run Cypress E2E suite
        run: pnpm exec cypress run

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-03
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

  # Cypress E2E coverage: the same suite as `cypress`, but against an
  # instrumented production build instead of the plain one. With
  # CYPRESS_COVERAGE=1, Next.js switches from SWC to Babel +
  # babel-plugin-istanbul (see the font fallback in
  # apps/web/app/layout.tsx), which is what exposes window.__coverage__
  # for @cypress/code-coverage to collect.
  #
  # Why a production build and not `next dev`: compiling every page
  # through Babel + istanbul makes `next dev` unusably slow (a single
  # page took ~50s to compile and the dev process died mid-suite in CI,
  # failing all 12 specs). Building once and serving with `next start`
  # keeps page loads fast while the client bundles stay instrumented.
  #
  # The .babelrc below is written ephemerally on this runner only, so
  # production builds keep using SWC. Its preset-env `exclude` works
  # around a Babel crash ("TypeError: e.charCodeAt is not a function")
  # in the unicode-regex transforms on patterns like /[\p{L}\p{N}]+/gu
  # (\p{...} inside a character class). The coverage build runs on
  # modern Chrome, which supports unicode property escapes natively,
  # so skipping the transpilation changes nothing at runtime.
  # The lcov report is uploaded to Codecov with the `cypress` flag
  # and merged with the unit-test reports.
  cypress-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.CYPRESS_E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.CYPRESS_E2E_TEST_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://localhost:3434
      NEXT_PUBLIC_POSTHOG_HOST: https://example.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: dummy-posthog-key
      NEXT_PUBLIC_WHATSAPP_NUMBER: "000000000000"
      CYPRESS_COVERAGE: "1"
      TESTING: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata (same contract as the web job): the instrumented
      # production build inlines the same VERSION/BUILD/COMMIT.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Check E2E secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Repository secret $var is not set (Settings > Secrets > Actions). The Cypress job needs it."
              missing=1
            fi
          done
          for var in E2E_TEST_EMAIL E2E_TEST_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set — is the repository secret CYPRESS_${var#E2E_TEST_} configured (Settings > Secrets > Actions)? The Cypress job needs it."
              missing=1
            fi
          done
          exit $missing

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries for Cypress's bundled Electron (Ubuntu 24.04).
      - name: Install Cypress system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev \
            libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install Cypress binary
        run: pnpm exec cypress install

      # Ephemeral: written on this runner only and discarded with it.
      # A committed .babelrc would disable SWC for every build, so it
      # must never land in the repo. The preset-env excludes dodge a
      # Babel crash on unicode property escapes inside character
      # classes (see the job comment above); transform-typeof-symbol is
      # next/babel's own default exclusion, kept as-is.
      - name: Enable coverage instrumentation
        run: |
          cat > .babelrc <<'EOF'
          {
            "presets": [
              ["next/babel", {"preset-env": {"exclude": ["transform-typeof-symbol", "transform-unicode-regex", "transform-unicode-property-regex"]}}]
            ],
            "plugins": ["istanbul"]
          }
          EOF

      # CYPRESS_COVERAGE=1 comes from the job-level env: the build must
      # be instrumented (and use the layout.tsx font fallback).
      - name: Instrumented production build
        run: pnpm build

      - name: Start instrumented app server
        shell: bash
        run: |
          set -euo pipefail
          # pnpm 10 forwards a literal `--` to the script, so `pnpm start -- -p 3434`
          # reaches Next as `next start -- -p 3434` and it reads `-p` as a project
          # directory. Invoke the binary directly.
          (pnpm exec next start -p 3434 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3434/; then
              echo "server up after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Instrumented Next.js server did not start on :3434"
          tail -50 /tmp/next-start.log || true
          exit 1

      - name: Run Cypress E2E suite (coverage)
        run: pnpm exec cypress run

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-03
        with:
          name: cypress-coverage-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

      # The @cypress/code-coverage plugin writes coverage/lcov.info
      # (reporters configured in apps/web/.nycrc).
      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/web/coverage/lcov.info
          flags: cypress
          fail_ci_if_error: true
          verbose: true

      # The ui-coverage-gates job (below) aggregates this report over the
      # PR's changed UI files that fall in the cypress-coverage scope.
      - name: Upload Cypress coverage for UI gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-cypress
          path: apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  # Validates Supabase migrations on every PR and push: numbering stays
  # append-only and strictly increasing, destructive DDL is blocked unless
  # explicitly approved, and the whole chain applies cleanly to a fresh
  # database. The CD workflow (.github/workflows/deploy.yml) runs
  # `supabase db push` against production after merge.
  supabase-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          fetch-depth: 0

      - name: Validate migration numbering and destructive changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 1. Every file is NNN_name.sql with a unique, strictly increasing
          #    numeric prefix (the prefix IS the apply order).
          prev_num=""
          prev_file=""
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ ! "$base" =~ ^([0-9]+)_(.+)\.sql$ ]]; then
              echo "::error file=$f::Migration filename must match NNN_name.sql (got '$base')"
              exit 1
            fi
            num="${BASH_REMATCH[1]}"
            if [[ -n "$prev_num" ]] && (( 10#$num <= 10#$prev_num )); then
              echo "::error file=$f::Migration numbers must be unique and strictly increasing ('$num' after '$prev_num' in '$prev_file')"
              exit 1
            fi
            prev_num="$num"
            prev_file="$base"
          done
          echo "numbering OK (${prev_file:-no migrations} is latest)"

          # 2. Destructive DDL gate (PRs only): DROP COLUMN, TRUNCATE, or an
          #    unconditional DROP TABLE in added lines needs the
          #    'db:destructive-approved' label. The recreate pattern
          #    (DROP ... IF EXISTS) is allowed.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            changed="$(git diff --name-only --diff-filter=AMR "$base_ref"...HEAD -- 'supabase/migrations/*.sql' || true)"
            destructive=0
            for f in $changed; do
              added="$(git diff -U0 "$base_ref"...HEAD -- "$f" | grep '^+' | grep -v '^+++' | sed 's/^+//' | grep -v '^[[:space:]]*--' || true)"
              if echo "$added" | grep -iqE 'drop[[:space:]]+column|truncate([[:space:]]|$)'; then
                echo "::error file=$f::Destructive statement (DROP COLUMN / TRUNCATE) in added lines"
                destructive=1
              fi
              if echo "$added" | grep -iqE 'drop[[:space:]]+table' | grep -qviE 'if[[:space:]]+exists'; then
                echo "::error file=$f::Unconditional DROP TABLE in added lines (use DROP ... IF EXISTS for the recreate pattern)"
                destructive=1
              fi
            done
            if [[ "$destructive" == "1" ]]; then
              labels="$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name' || true)"
              if ! echo "$labels" | grep -qx 'db:destructive-approved'; then
                echo "::error::Destructive migration blocked: add the 'db:destructive-approved' label to approve data-loss DDL explicitly."
                exit 1
              fi
              echo "destructive migration explicitly approved via label"
            else
              echo "no destructive DDL in changed migrations"
            fi
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1 pinned 2026-10-03
        with:
          version: '2.119.0'

      - name: Create Supabase-compat stubs on ephemeral Postgres
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Vanilla Postgres lacks Supabase's auth schema, but migrations
          # reference auth.uid() in RLS policies (name-resolved at DDL time).
          # Stub it so validation matches production name resolution.
          # Same for the Storage schema: migration 014 inserts into
          # storage.buckets and creates policies on storage.objects, which
          # only exist on a real Supabase project.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false
          );
          create table if not exists storage.objects (
            id uuid primary key,
            bucket_id text,
            name text
          );
          SQL

      - name: Apply migrations to ephemeral Postgres
        run: |
          set -euo pipefail
          # Proves the whole chain applies cleanly, in order, to a fresh DB.
          # (sslmode=disable: the ephemeral service has no TLS; production
          # uses `supabase link` + `db push --linked`, which negotiates TLS.)
          supabase db push --yes --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          echo "migrations applied cleanly"

  # UI coverage gates: when a PR changes UI files (apps/web/app/** or
  # apps/web/components/**, *.ts/*.tsx excluding tests), enforce minimum
  # coverage on exactly those files:
  #   vitest (unit)      ≥ 80% aggregate line coverage (cobertura report)
  #   cypress (e2e)      ≥ 80% aggregate line coverage (lcov report), over
  #                        the changed UI files that fall within the
  #                        cypress-coverage instrumentation scope
  #                        (codeCoverage.include in cypress.config.ts);
  #                        files outside that scope are exempt.
  #   mutation (stryker) ≥ 60% score over the changed UI files.
  # Posts (and refreshes) a single PR comment with the three percentages.
  #
  # This job runs on EVERY PR (never skipped: `always()` + no path
  # filters) so it can be a required check in the main ruleset — with no
  # UI changes it passes vacuously. Missing coverage reports with UI
  # changes are fail-closed: without measurement there is no proof the
  # threshold holds.
  #
  # Stryker runs here scoped to the changed UI files only (the mutation
  # workflow's informational run is untouched). The stryker.config.json
  # sets no thresholds, so Stryker exits 0 on low scores and only fails
  # on execution errors; the 60% threshold is enforced by evaluate.mjs.
  ui-coverage-gates:
    name: ui-coverage-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    needs: [web, cypress-coverage]
    if: always() && github.event_name == 'pull_request' && !cancelled()
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Unit tests (ui-gates scripts)
        run: node --test .github/scripts/ui-gates/*.test.mjs

      - name: Detect changed UI files
        id: detect
        run: |
          set -euo pipefail
          files="$(node .github/scripts/ui-gates/detect.mjs --base "origin/${{ github.base_ref }}" --head HEAD)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Changed UI files: $files"
          else
            echo "No UI files changed — gates pass vacuously."
          fi

      - name: Download coverage artifacts
        if: steps.detect.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ui-gates/vitest /tmp/ui-gates/cypress
          gh run download "${{ github.run_id }}" -n coverage-vitest -D /tmp/ui-gates/vitest || echo "coverage-vitest artifact not found"
          gh run download "${{ github.run_id }}" -n coverage-cypress -D /tmp/ui-gates/cypress || echo "coverage-cypress artifact not found"
          find /tmp/ui-gates -type f | head -20

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.detect.outputs.files != ''
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.detect.outputs.files != ''
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.files != ''
        run: pnpm install --frozen-lockfile

      # Same scoped invocation as the mutation workflow; the UI file list
      # is a subset of that workflow's changed-files scope.
      # Brackets in Next.js route paths ([id], [slotId]) are minimatch
      # character classes — escape them as [[] / []] so Stryker matches the
      # literal files. (Stryker's normalizeFileName turns backslashes into
      # slashes, so backslash-escaping cannot work here.)
      - name: Run Stryker on changed UI files
        if: steps.detect.outputs.files != ''
        working-directory: apps/web
        run: |
          set -euo pipefail
          stryker_files="$(echo "${{ steps.detect.outputs.files }}" | sed 's|apps/web/||g' | perl -pe 's/(\[|\])/$1 eq "[" ? "[[]" : "[]]"/ge')"
          echo "Mutating UI files: $stryker_files"
          pnpm exec stryker run --mutate "$stryker_files"

      - name: Evaluate gates
        id: evaluate
        if: always()
        run: |
          set -euo pipefail
          # Fail closed: if changed-file detection itself failed, never pass
          # vacuously on an empty file list.
          if [[ "${{ steps.detect.outcome }}" != "success" ]]; then
            echo "::error::Changed-UI-file detection failed; refusing to pass vacuously."
            echo "gates_exit=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cobertura="$(find /tmp/ui-gates/vitest -name 'cobertura-coverage.xml' 2>/dev/null | head -n 1 || true)"
          lcov="$(find /tmp/ui-gates/cypress -name 'lcov.info' 2>/dev/null | head -n 1 || true)"
          set +e
          node .github/scripts/ui-gates/evaluate.mjs \
            --ui-files "${{ steps.detect.outputs.files }}" \
            --cobertura "$cobertura" \
            --lcov "$lcov" \
            --mutation apps/web/reports/mutation/mutation.json \
            --out /tmp/ui-gates/findings.json
          code=$?
          set -e
          echo "gates_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            echo "::error::UI coverage gates failed (see the PR comment and the findings below)."
            cat /tmp/ui-gates/findings.json || true
          fi

      - name: Post/update PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          findings=/tmp/ui-gates/findings.json
          pr="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          existing_id=$(gh api "repos/$repo/issues/$pr/comments" --jq '.[] | select(.body | contains("<!-- ui-coverage-gates -->")) | .id' | head -n 1 || true)
          if [[ ! -f "$findings" ]]; then
            echo "no findings file; skipping PR comment"
            exit 0
          fi
          ui_count=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('$findings','utf8')).uiFiles.length)")
          if [[ "$ui_count" == "0" ]]; then
            if [[ -n "$existing_id" ]]; then
              gh api -X DELETE "repos/$repo/issues/comments/$existing_id" > /dev/null
              echo "no UI files changed; removed stale gate comment $existing_id"
            else
              echo "no UI files changed; nothing to post"
            fi
            exit 0
          fi
          body_file="$(mktemp)"
          node .github/scripts/ui-gates/comment.mjs --findings "$findings" > "$body_file"
          if [[ -n "$existing_id" ]]; then
            gh api -X PATCH "repos/$repo/issues/comments/$existing_id" -F body=@"$body_file" > /dev/null
            echo "updated PR comment $existing_id"
          else
            gh pr comment "$pr" --repo "$repo" --body-file "$body_file" > /dev/null
            echo "posted new PR comment"
          fi

      - name: Fail on gate violations
        if: always()
        run: |
          if [[ "${{ steps.evaluate.outputs.gates_exit }}" != "0" ]]; then
            echo "::error::UI coverage gates failed: vitest ≥ 80%, cypress ≥ 80%, mutation ≥ 60% on changed UI files."
            exit 1
          fi
          echo "UI coverage gates pass."
