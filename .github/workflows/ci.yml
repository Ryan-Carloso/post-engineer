name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regression gate for the review-workflow files (opencode-review.yml
  # and its validator). This job checks out the PR's
  # own merge ref, so a commit that relaxes both a workflow and its
  # validator passes the gate by construction — the gate is
  # accidental-regression protection, NOT tamper-resistance. The remote
  # opencode-review is the adversarial layer: any such
  # relaxation shows up as a reviewed diff before merge.
  review-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-09-25
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-validator.txt'

      - name: Install validator dependencies
        run: |
          set -euo pipefail
          pip install --quiet -r .github/scripts/requirements-validator.txt

      - name: Validate review workflows
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-opencode-review.py

      - name: Unit-test review scripts
        run: |
          set -euo pipefail
          pip install --quiet pytest
          python3 -m pytest .github/scripts/tests -q

  # Regression tests for the MCP release workflow (release-mcp.yml): the
  # generated release version and the version stamp against a scratch git
  # repo with a stubbed gh, and the npm-propagation wait step against the
  # live npm registry. Fast, no secrets.
  test-release-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - name: Test the MCP release workflows
        run: |
          set -euo pipefail
          python3 -c "import yaml" || pip install --quiet --break-system-packages pyyaml
          bash .github/scripts/test-mcp-release-version.sh
          bash .github/scripts/test-release-mcp-registry-wait.sh

  # Fails if secret-bearing files are tracked in git. Real .env files must
  # never be committed (see the env-files policy in AGENTS.md).
  secrets-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - name: Fail if secret-bearing files are tracked
        run: |
          set -euo pipefail
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Real .env files are tracked in git:"
            echo "$tracked_env"
            exit 1
          fi
          echo "secrets hygiene OK: no secret-bearing files tracked"

  # Frontend gate. lint, typecheck, the production build, and the sharded
  # unit tests run in parallel inside frontend-ci.yml. The merged
  # vitest coverage is still uploaded as `coverage-vitest` for the UI gate.
  web-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-ci.yml

  # Required `web` check. A reusable-workflow caller job reports no check
  # run of its own (only the `web-ci / ...` sub-jobs report), so without
  # this aggregator the ruleset's required `web` context waits forever
  # and the PR can never merge. It fails when the frontend gate failed.
  web:
    needs: [web-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail if the frontend gate failed
        run: |
          if [ "${{ needs.web-ci.result }}" != "success" ]; then
            echo "frontend-ci result: ${{ needs.web-ci.result }}" >&2
            exit 1
          fi
          echo "frontend-ci passed"

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # bun check is a drop-in for this package: the tsconfig has no baseUrl
      # and lists "types": ["node"]. It only checks. The build above still
      # emits declarations with tsc.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Lint
        # Same pinned oxlint as the web job. The MCP package.json stays on
        # eslint so this diff does not touch a parity-guarded file.
        run: pnpm dlx oxlint@1.94.0 -c .oxlintrc.json src

      - name: Typecheck
        run: bun check --no-script -p tsconfig.json --no-pretty && bun check --no-script -p tsconfig.spec.json --no-pretty

      - name: Unit tests
        # NOTE: pass flags via `pnpm exec vitest` — `pnpm test -- --coverage`
        # forwards a literal `--` to the script (pnpm 10), which makes vitest
        # silently skip coverage generation (no report files written).
        run: pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=cobertura

      # Codecov is the coverage gate (GitHub's native coverage needs a paid
      # plan): fail the job if the upload fails so a silent miss can never
      # bypass the codecov/project and codecov/patch status checks.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/mcp/coverage/cobertura-coverage.xml
          flags: mcp
          fail_ci_if_error: true
          verbose: true

  # Full Cypress E2E suite (cypress/e2e/**): real Next.js server, real
  # Supabase session (the middleware validates the cookie server-side, so
  # intercepts alone cannot authenticate), network-level mocks only for
  # what cannot run in CI (social OAuth).
  #
  # Supabase is a throwaway local stack started in the runner
  # (.github/actions/local-supabase): the migration chain is applied and the
  # E2E user below is seeded by apps/web/cypress/supabase/seed-e2e.sh. The
  # job never talks to the production project and needs no secrets: every
  # page hit verifies the session in middleware.ts with
  # supabase.auth.getClaims() (which falls back to a getUser() request while
  # the project still uses the legacy HS256 secret), and running the suite
  # against production made CI half of that project's billed log ingestion.
  # The E2E credentials are fixed values that only exist in that
  # local stack.
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_TEST_EMAIL: e2e@post-engineer.test
      E2E_TEST_PASSWORD: local-e2e-password
      NEXT_PUBLIC_APP_URL: http://localhost:3434
      NEXT_PUBLIC_POSTHOG_HOST: https://example.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: dummy-posthog-key
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata (same contract as the web job): the Cypress
      # production build inlines the same VERSION/BUILD/COMMIT the unit
      # job verified.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/local-supabase

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries for Cypress's bundled Electron (Ubuntu 24.04).
      - name: Install Cypress system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev \
            libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install Cypress binary
        run: pnpm exec cypress install

      # webpack's persistent cache: a warm cache cut the instrumented compile
      # from 3.2 min to 20s locally. Only main saves it (after its build), so
      # pull requests restore main's cache and never evict each other's.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-build-cypress-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-cypress-${{ hashFiles('pnpm-lock.yaml') }}-
            next-build-cypress-

      # Lint already runs in web-ci (its build and its lint job).
      - name: Production build
        run: pnpm build --no-lint

      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-build-cypress-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Start app server
        shell: bash
        run: |
          set -euo pipefail
          # pnpm 10 forwards a literal `--` to the script, so `pnpm start -- -p 3434`
          # reaches Next as `next start -- -p 3434` and it reads `-p` as a project
          # directory. Invoke the binary directly.
          (pnpm exec next start -p 3434 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3434/; then
              echo "server up after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Next.js server did not start on :3434"
          tail -50 /tmp/next-start.log || true
          exit 1

      # Credentials come from the job-level env (E2E_TEST_*, the names
      # cypress.config.ts reads), so no step-level env is needed here.
      - name: Run Cypress E2E suite
        run: pnpm exec cypress run

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4 pinned 2026-10-03
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

  # Cypress E2E coverage: the same suite as `cypress`, but against an
  # instrumented production build instead of the plain one. With
  # CYPRESS_COVERAGE=1, Next.js switches from SWC to Babel +
  # babel-plugin-istanbul (see the font fallback in
  # apps/web/app/layout.tsx), which is what exposes window.__coverage__
  # for @cypress/code-coverage to collect.
  #
  # Why a production build and not `next dev`: compiling every page
  # through Babel + istanbul makes `next dev` unusably slow (a single
  # page took ~50s to compile and the dev process died mid-suite in CI,
  # failing all 12 specs). Building once and serving with `next start`
  # keeps page loads fast while the client bundles stay instrumented.
  #
  # The .babelrc below is written ephemerally on this runner only, so
  # production builds keep using SWC. Its preset-env `exclude` works
  # around a Babel crash ("TypeError: e.charCodeAt is not a function")
  # in the unicode-regex transforms on patterns like /[\p{L}\p{N}]+/gu
  # (\p{...} inside a character class). The coverage build runs on
  # modern Chrome, which supports unicode property escapes natively,
  # so skipping the transpilation changes nothing at runtime.
  # The lcov report is uploaded to Codecov with the `cypress` flag
  # and merged with the unit-test reports.
  cypress-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_TEST_EMAIL: e2e@post-engineer.test
      E2E_TEST_PASSWORD: local-e2e-password
      NEXT_PUBLIC_APP_URL: http://localhost:3434
      NEXT_PUBLIC_POSTHOG_HOST: https://example.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: dummy-posthog-key
      CYPRESS_COVERAGE: "1"
      TESTING: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build metadata (same contract as the web job): the instrumented
      # production build inlines the same VERSION/BUILD/COMMIT.
      - name: Set build metadata
        run: |
          echo "VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/local-supabase

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries for Cypress's bundled Electron (Ubuntu 24.04).
      - name: Install Cypress system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev \
            libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install Cypress binary
        run: pnpm exec cypress install

      # Ephemeral: written on this runner only and discarded with it.
      # A committed .babelrc would disable SWC for every build, so it
      # must never land in the repo. The preset-env excludes dodge a
      # Babel crash on unicode property escapes inside character
      # classes (see the job comment above); transform-typeof-symbol is
      # next/babel's own default exclusion, kept as-is.
      - name: Enable coverage instrumentation
        run: |
          cat > .babelrc <<'EOF'
          {
            "presets": [
              ["next/babel", {"preset-env": {"exclude": ["transform-typeof-symbol", "transform-unicode-regex", "transform-unicode-property-regex"]}}]
            ],
            "plugins": ["istanbul"]
          }
          EOF

      # webpack's persistent cache: a warm cache cut the instrumented compile
      # from 3.2 min to 20s locally. Only main saves it (after its build), so
      # pull requests restore main's cache and never evict each other's.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-build-cypress-coverage-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-cypress-coverage-${{ hashFiles('pnpm-lock.yaml') }}-
            next-build-cypress-coverage-

      # CYPRESS_COVERAGE=1 comes from the job-level env: the build must
      # be instrumented (and use the layout.tsx font fallback).
      # Lint already runs in web-ci (its build and its lint job).
      - name: Instrumented production build
        run: pnpm build --no-lint

      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-build-cypress-coverage-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Start instrumented app server
        shell: bash
        run: |
          set -euo pipefail
          # pnpm 10 forwards a literal `--` to the script, so `pnpm start -- -p 3434`
          # reaches Next as `next start -- -p 3434` and it reads `-p` as a project
          # directory. Invoke the binary directly.
          (pnpm exec next start -p 3434 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3434/; then
              echo "server up after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Instrumented Next.js server did not start on :3434"
          tail -50 /tmp/next-start.log || true
          exit 1

      - name: Run Cypress E2E suite (coverage)
        run: pnpm exec cypress run

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4 pinned 2026-10-03
        with:
          name: cypress-coverage-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

      # The @cypress/code-coverage plugin writes coverage/lcov.info
      # (reporters configured in apps/web/.nycrc).
      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/web/coverage/lcov.info
          flags: cypress
          fail_ci_if_error: true
          verbose: true

      # The ui-coverage-gates job (below) aggregates this report over the
      # PR's changed UI files that fall in the cypress-coverage scope.
      - name: Upload Cypress coverage for UI gates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cypress
          path: apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  # Validates Supabase migrations on every PR and push: numbering stays
  # append-only and strictly increasing, and the whole chain applies
  # cleanly to a fresh database. The CD workflow
  # (.github/workflows/deploy.yml) runs `supabase db push` against
  # production after merge.
  supabase-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          fetch-depth: 0

      - name: Validate migration numbering
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 1. Every file is NNN_name.sql with a unique, strictly increasing
          #    numeric prefix (the prefix IS the apply order).
          prev_num=""
          prev_file=""
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ ! "$base" =~ ^([0-9]+)_(.+)\.sql$ ]]; then
              echo "::error file=$f::Migration filename must match NNN_name.sql (got '$base')"
              exit 1
            fi
            num="${BASH_REMATCH[1]}"
            if [[ -n "$prev_num" ]] && (( 10#$num <= 10#$prev_num )); then
              echo "::error file=$f::Migration numbers must be unique and strictly increasing ('$num' after '$prev_num' in '$prev_file')"
              exit 1
            fi
            prev_num="$num"
            prev_file="$base"
          done
          echo "numbering OK (${prev_file:-no migrations} is latest)"

          # BETA: no destructive-DDL label gate. Destructive migrations are
          # approved by the owner's merge tap, no separate label step.
          # Reintroduce the `db:destructive-approved` label gate explicitly
          # when the first paying user arrives (the BETA flip rule).

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.0.1 pinned 2026-10-03
        with:
          version: '2.119.0'

      - name: Create Supabase-compat stubs on ephemeral Postgres
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Vanilla Postgres lacks Supabase's auth schema, but migrations
          # reference auth.uid() in RLS policies (name-resolved at DDL time).
          # Stub it so validation matches production name resolution.
          # Same for the Storage schema: migration 014 inserts into
          # storage.buckets and creates policies on storage.objects, which
          # only exist on a real Supabase project.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
          -- Supabase roles and the default GRANT ALL they receive on every
          -- new table. 066 revokes that grant down to the session columns;
          -- without the default grant, a forgotten revoke would not show up.
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on functions to anon, authenticated, service_role;
          create schema if not exists auth;
          grant usage on schema auth to anon, authenticated, service_role;
          -- Missing setting returns null, matching an anonymous request.
          -- scripts/db/check-core-tables-rls.sql sets the claim to act as a user.
          create or replace function auth.uid() returns uuid
            language sql stable as $$
              select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            $$;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false
          );
          create table if not exists storage.objects (
            id uuid primary key,
            bucket_id text,
            name text
          );
          SQL

      - name: Apply migrations to ephemeral Postgres
        run: |
          set -euo pipefail
          # Proves the whole chain applies cleanly, in order, to a fresh DB.
          # (sslmode=disable: the ephemeral service has no TLS; production
          # uses `supabase link` + `db push --linked`, which negotiates TLS.)
          supabase db push --yes --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          echo "migrations applied cleanly"

      - name: Check core-table RLS privileges
        run: |
          set -euo pipefail
          # authenticated must not write billing columns, must not read
          # another user's rows, and must still be able to do each session
          # operation. See scripts/db/check-core-tables-rls.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-core-tables-rls.sql

      - name: Check user_prompts behaviour
        run: |
          set -euo pipefail
          # Default private, the updated_at trigger, the visibility transition,
          # slug uniqueness and the service-role-only grants of 076_user-prompts.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-user-prompts.sql

      - name: Check prompt_versions behaviour
        run: |
          set -euo pipefail
          # Versions recorded on create and body change only, immutable rows,
          # kept after the prompt is deleted, no official-version function,
          # the post_metrics snapshot and the service-role-only grants of
          # 078_prompt-versions.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-prompt-versions.sql

      - name: Check share_links behaviour
        run: |
          set -euo pipefail
          # The active-link cap, the persona scope of the week's posts, the
          # column grants and the service-role-only functions of
          # 080_share-links.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-share-links.sql

      - name: Check publish entitlement behaviour
        run: |
          set -euo pipefail
          # The Stripe state -> access_until mapping, the dunning grace, the
          # refusal to guess an unknown status or customer, the operator
          # revoke, and the service-role-only grants of 089_access-entitlement.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-access-entitlement.sql

      - name: Check publish slot claim behaviour
        run: |
          set -euo pipefail
          # Which slots claim_next_publish_slot may claim (status filter, access,
          # lease lapse incl. a null lease), the inactive-owner expiry and the
          # lease release of 094_publish-due-scheduler.sql.
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -f scripts/db/check-publish-claim.sql

      - name: Check publish slot claim under concurrency
        run: |
          set -euo pipefail
          # Two sessions claim the same due slot: exactly one gets it, the other
          # skips the locked row and gets nothing.
          scripts/db/check-publish-claim-concurrency.sh "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"

      - name: Check the schema snapshot is up to date
        run: |
          set -euo pipefail
          # supabase/schema.snapshot.json is Postgres's own report of the
          # migrated schema (columns, NOT NULL, CHECK/FK, RLS, policies). The
          # unit tests compare the code's enum lists against it; this step
          # keeps the snapshot honest. Regenerate locally with
          # `node scripts/db/dump-schema.mjs --db-url <url> --write`.
          node scripts/db/dump-schema.mjs --check --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"

  # UI coverage gates: when a PR changes UI files (apps/web/app/** or
  # apps/web/components/**, *.ts/*.tsx excluding tests), enforce minimum
  # coverage on exactly those files:
  #   vitest (unit)      ≥ 80% aggregate line coverage (cobertura report)
  #   cypress (e2e)      ≥ 80% aggregate line coverage (lcov report), over
  #                        the changed UI files that fall within the
  #                        cypress-coverage instrumentation scope
  #                        (codeCoverage.include in cypress.config.ts);
  #                        files outside that scope are exempt.
  #   mutation (stryker) ≥ 60% score over the changed UI files.
  # Posts (and refreshes) a single PR comment with the three percentages.
  #
  # This job runs on EVERY PR (never skipped: `always()` + no path
  # filters) so it can be a required check in the main ruleset — with no
  # UI changes it passes vacuously. Missing coverage reports with UI
  # changes are fail-closed: without measurement there is no proof the
  # threshold holds.
  #
  # Stryker runs here scoped to the changed UI files only (the mutation
  # workflow's informational run is untouched). The stryker.config.json
  # sets no thresholds, so Stryker exits 0 on low scores and only fails
  # on execution errors; the 60% threshold is enforced by evaluate.mjs.
  ui-coverage-gates:
    name: ui-coverage-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    needs: [web, cypress-coverage]
    if: always() && github.event_name == 'pull_request' && !cancelled()
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Unit tests (ui-gates scripts)
        run: node --test .github/scripts/ui-gates/*.test.mjs

      # Installed before detection: detect.mjs drops comment-only changes
      # by comparing TypeScript tokens, which needs the typescript package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed UI files
        id: detect
        run: |
          set -euo pipefail
          files="$(node .github/scripts/ui-gates/detect.mjs --base "origin/${{ github.base_ref }}" --head HEAD)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Changed UI files: $files"
          else
            echo "No UI files changed — gates pass vacuously."
          fi

      - name: Download coverage artifacts
        if: steps.detect.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ui-gates/vitest /tmp/ui-gates/cypress
          gh run download "${{ github.run_id }}" -n coverage-vitest -D /tmp/ui-gates/vitest || echo "coverage-vitest artifact not found"
          gh run download "${{ github.run_id }}" -n coverage-cypress -D /tmp/ui-gates/cypress || echo "coverage-cypress artifact not found"
          find /tmp/ui-gates -type f | head -20

      # Stryker runs vitest/tsc directly (no prebuild), and the changed UI
      # files include the hosted /mcp route, which imports the MCP package
      # (workspace:*) through apps/mcp/dist — build it first.
      - name: Build MCP package
        if: steps.detect.outputs.files != ''
        run: pnpm --filter post-engineer-mcp build

      # Same scoped invocation as the mutation workflow: line ranges first
      # (the extractor scopes to the PR's changed lines and emits the
      # bracket-escaped patterns), whole changed files as fallback. The
      # mapping comment + summary marker make the run VISIBLE: if the
      # extractor cannot run, the shard fails loudly — never silently
      # green. The mutation gate below reads the score over the mutants
      # the run REPORTED — with line scoping that is exactly the PR's
      # changed lines' mutants (files outside the PR are mutate:false and
      # absent from the report), so the "mutation ≥ 60% on changed UI
      # files" semantics hold.
      - name: Run Stryker on changed UI files
        if: steps.detect.outputs.files != ''
        working-directory: apps/web
        env:
          UI_FILES: ${{ steps.detect.outputs.files }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/ui-gates/changed-ranges.mjs"
          [ -f "$SCRIPT" ] || { echo "::error::extractor script not found at $SCRIPT"; exit 1; }
          mutate="$(node "$SCRIPT" --files "$UI_FILES" --strip-prefix 'apps/web/' --base "origin/$BASE_REF" --head HEAD || true)"
          if [ -n "$mutate" ]; then
            echo "Mutating changed line ranges: $mutate"
            {
              echo "## Stryker line-scoped patterns (this run's scope)"
              echo ""
              echo '```'
              echo "$mutate"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Stryker's --mutate takes ONE comma-separated argument: a
            # space-separated list is treated as a single glob pattern
            # matching nothing, which fails the scoped run and forces the
            # whole-file fallback (same pitfall as mutation.yml — the
            # comma-join there, with NO space after the comma, is the
            # working form; a leading space makes later globs match
            # nothing and the run passes vacuously with 0 mutants).
            if pnpm exec stryker run --mutate "${mutate// /,}"; then
              exit 0
            fi
            echo "::warning::line-scoped run failed — falling back to whole changed files"
          fi
          # Brackets in Next.js route paths ([id], [slotId]) are minimatch
          # character classes — escape them as [[] / []] so Stryker matches
          # the literal files. (Stryker's normalizeFileName turns
          # backslashes into slashes, so backslash-escaping cannot work
          # here.) Single pass only.
          stryker_files="$(echo "$UI_FILES" | sed 's|apps/web/||g' | perl -pe 's/(\[|\])/$1 eq "[" ? "[[]" : "[]]"/ge')"
          echo "Mutating whole UI files: $stryker_files"
          pnpm exec stryker run --mutate "$stryker_files"

      - name: Evaluate gates
        id: evaluate
        if: always()
        run: |
          set -euo pipefail
          # Fail closed: if changed-file detection itself failed, never pass
          # vacuously on an empty file list.
          if [[ "${{ steps.detect.outcome }}" != "success" ]]; then
            echo "::error::Changed-UI-file detection failed; refusing to pass vacuously."
            echo "gates_exit=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cobertura="$(find /tmp/ui-gates/vitest -name 'cobertura-coverage.xml' 2>/dev/null | head -n 1 || true)"
          lcov="$(find /tmp/ui-gates/cypress -name 'lcov.info' 2>/dev/null | head -n 1 || true)"
          set +e
          node .github/scripts/ui-gates/evaluate.mjs \
            --ui-files "${{ steps.detect.outputs.files }}" \
            --cobertura "$cobertura" \
            --lcov "$lcov" \
            --mutation apps/web/reports/mutation/mutation.json \
            --out /tmp/ui-gates/findings.json
          code=$?
          set -e
          echo "gates_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            echo "::error::UI coverage gates failed (see the PR comment and the findings below)."
            cat /tmp/ui-gates/findings.json || true
          fi

      - name: Post/update PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          findings=/tmp/ui-gates/findings.json
          pr="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          existing_id=$(gh api "repos/$repo/issues/$pr/comments" --jq '.[] | select(.body | contains("<!-- ui-coverage-gates -->")) | .id' | head -n 1 || true)
          if [[ ! -f "$findings" ]]; then
            echo "no findings file; skipping PR comment"
            exit 0
          fi
          ui_count=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('$findings','utf8')).uiFiles.length)")
          if [[ "$ui_count" == "0" ]]; then
            if [[ -n "$existing_id" ]]; then
              gh api -X DELETE "repos/$repo/issues/comments/$existing_id" > /dev/null
              echo "no UI files changed; removed stale gate comment $existing_id"
            else
              echo "no UI files changed; nothing to post"
            fi
            exit 0
          fi
          body_file="$(mktemp)"
          node .github/scripts/ui-gates/comment.mjs --findings "$findings" > "$body_file"
          if [[ -n "$existing_id" ]]; then
            gh api -X PATCH "repos/$repo/issues/comments/$existing_id" -F body=@"$body_file" > /dev/null
            echo "updated PR comment $existing_id"
          else
            gh pr comment "$pr" --repo "$repo" --body-file "$body_file" > /dev/null
            echo "posted new PR comment"
          fi

      - name: Fail on gate violations
        if: always()
        run: |
          if [[ "${{ steps.evaluate.outputs.gates_exit }}" != "0" ]]; then
            echo "::error::UI coverage gates failed: vitest ≥ 80%, cypress ≥ 80%, mutation ≥ 60% on changed UI files."
            exit 1
          fi
          echo "UI coverage gates pass."
