name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regression gate for the review-workflow files (ocr-review.yml,
  # opencode-review.yml and their validators). This job checks out the PR's
  # own merge ref, so a commit that relaxes both a workflow and its
  # validator passes the gate by construction — the gate is
  # accidental-regression protection, NOT tamper-resistance. The remote
  # opencode-review and OCR reviews are the adversarial layer: any such
  # relaxation shows up as a reviewed diff before merge.
  review-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-09-25
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-validator.txt'

      - name: Install validator dependencies
        run: |
          set -euo pipefail
          pip install --quiet -r .github/scripts/requirements-validator.txt

      - name: Validate review workflows
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-opencode-review.py
          python3 .github/scripts/validate-ocr-review.py

      - name: Validator self-tests
        run: |
          set -euo pipefail
          python3 -m pytest .github/scripts/test_validate_ocr_review.py -q

  # Fails if secret-bearing files are tracked in git. config.toml may hold
  # provider API keys and real .env files must never be committed (see the
  # env-files policy in AGENTS.md).
  secrets-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25

      - name: Fail if secret-bearing files are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -qx 'apps/engine/config.toml'; then
            echo "::error::apps/engine/config.toml is tracked in git. Untrack it: git rm --cached apps/engine/config.toml"
            exit 1
          fi
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Real .env files are tracked in git:"
            echo "$tracked_env"
            exit 1
          fi
          echo "secrets hygiene OK: no secret-bearing files tracked"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: latest

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app cli.py scripts test

      - name: Tests
        run: uv run pytest -q
