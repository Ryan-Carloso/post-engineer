name: Deploy

# Applies pending Supabase migrations right after a PR merges to main (or
# via workflow_dispatch, e.g. to recover after a failed deploy).
#
# Flow:
#   1. This workflow runs `supabase db push --linked --include-all`, which
#      applies migrations missing from the remote history table
#      (supabase_migrations.schema_migrations) in migration-file order,
#      including out-of-order ones (see the push step comment).
#   2. The web app itself is deployed to our own VPS (see
#      apps/web/docker-compose.yml, deployed with deploy.sh on the host) —
#      migrations land first, then the host is redeployed.
#
# Why on merge instead of on CI success: branch protection already encodes
# the quality bar via required checks. Gating on the full CI suite going
# green on main held migrations back whenever a non-required job (e.g.
# cypress) went red after merge, leaving merged code on main without its
# schema. The merge is the ship decision; the migration SQL itself was
# already validated by CI on the PR (supabase-migrations job).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (for `supabase link`)
#   SUPABASE_PROJECT_ID    - Supabase project ref (for `supabase link`)
#   SUPABASE_DB_PASSWORD   - Database password (direct Postgres connection for `db push`)
# One-time production bootstrap (run once LOCALLY, before the first automated
# run — not in CI, not on the VPS): see supabase/README.md ("Pipeline
# secrets"). It marks the dashboard-applied migrations as applied without
# re-running their SQL:
#   supabase migration repair --status applied 001 002 003 \
#     --db-url "postgresql://postgres:<DB_PASSWORD>@db.<PROJECT_REF>.supabase.co:5432/postgres"

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  migrate:
    # Merged PRs only (not plain closes), and only for PRs from this repo:
    # the pull_request event does not expose secrets to fork PRs, so
    # without the repo guard a fork merge would fail loudly on the secret
    # checks below instead of skipping quietly. workflow_dispatch always
    # deploys the main branch (pinned in checkout below) to re-run a
    # failed deploy without waiting for the next merge.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          # Deployed code is always a merged main commit (or main itself on
          # workflow_dispatch — a dispatch from another branch must not
          # deploy that branch).
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.event.pull_request.merge_commit_sha }}

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1 pinned 2026-10-03
        with:
          version: '2.119.0'

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is not set}"
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID secret is not set}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret is not set}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          # Applies exactly the migrations missing from the remote history
          # table, in file order. --include-all also accepts pending
          # migrations that sort BEFORE the newest one applied on the
          # remote: after out-of-order merges (an older-numbered migration
          # whose PR merged after a newer one), plain db push fails with
          # "Found local migration files to be inserted before the last
          # migration on remote database" and repeats that failure on every
          # merge until the flag is added. This left migration 024 pending
          # while 025/026 were already applied, so production lacked
          # personas.cta_text (deploy run 39980975841). Applied files stay
          # skipped: pending-only semantics and the CI-validated idempotent
          # SQL are unchanged, so safety does not depend on the flag.
          # (--yes: non-interactive.)
          supabase db push --yes --linked --include-all
          echo "production migrations up to date"
