name: Deploy

# CD: runs after CI passes on main. Applies pending Supabase migrations,
# then triggers the Vercel production deploy via deploy hook.
#
# Ordering is guaranteed by construction:
#   1. Vercel's automatic GitHub deployment for `main` is disabled in
#      apps/web/vercel.json (git.deploymentEnabled.main = false), so a push
#      to main never starts a production build on its own. PR previews are
#      unaffected (only `main` is disabled).
#   2. This workflow applies migrations with `supabase db push` (pending
#      migrations only, tracked in supabase_migrations.schema_migrations).
#   3. Only if migrations succeed, the Vercel deploy hook builds & deploys
#      the latest main commit to production.
# If migrations fail, no deploy happens and production keeps serving the
# last good build.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (for `supabase link`)
#   SUPABASE_PROJECT_ID    - Supabase project ref (for `supabase link`)
#   SUPABASE_DB_PASSWORD   - Database password (direct Postgres connection for `db push`)
#   VERCEL_DEPLOY_HOOK_URL - Deploy hook URL for the main branch
#                            (Vercel dashboard > project > Settings > Git > Deploy Hooks)
# One-time production bootstrap (run once, locally, before the first deploy):
#   supabase link --project-ref "$SUPABASE_PROJECT_ID"
#   supabase migration repair --status applied --version 001
#   supabase migration repair --status applied --version 002
#   supabase migration repair --status applied --version 003
# (Marks the dashboard-applied migrations as applied so the first
# `db push` only applies genuinely new files. All statements are idempotent,
# so skipping this is safe but slower/noisier.)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1 pinned 2026-10-03
        with:
          version: '2.119.0'

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID secret is not set}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret is not set}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          # Applies ONLY migrations missing from the remote history table.
          # (--yes: non-interactive; safety comes from CI validation on the
          # PR plus pending-only semantics, not from an interactive prompt.)
          supabase db push --yes --linked
          echo "production migrations up to date"

  deploy-vercel:
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          : "${VERCEL_DEPLOY_HOOK_URL:?VERCEL_DEPLOY_HOOK_URL secret is not set}"
          resp="$(curl -fsS --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL")"
          echo "$resp" | python3 -c "import json,sys; d=json.load(sys.stdin); print('deploy hook accepted, job:', d.get('job', {}).get('id', '?'))"
