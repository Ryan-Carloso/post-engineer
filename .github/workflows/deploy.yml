name: Deploy

# Applies pending Supabase migrations after CI passes on main.
#
# Flow:
#   1. This workflow runs `supabase db push --linked`, which applies ONLY
#      pending migrations (tracked in supabase_migrations.schema_migrations).
#   2. The web app itself is deployed to our own VPS (see
#      apps/web/docker-compose.yml, deployed with deploy.sh on the host) —
#      migrations land first, then the host is redeployed.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (for `supabase link`)
#   SUPABASE_PROJECT_ID    - Supabase project ref (for `supabase link`)
#   SUPABASE_DB_PASSWORD   - Database password (direct Postgres connection for `db push`)
# One-time production bootstrap (run once LOCALLY, before the first automated
# run — not in CI, not on the VPS): see supabase/README.md ("Pipeline
# secrets"). It marks the dashboard-applied migrations as applied without
# re-running their SQL:
#   supabase migration repair --status applied 001 002 003 \
#     --db-url "postgresql://postgres:<DB_PASSWORD>@db.<PROJECT_REF>.supabase.co:5432/postgres"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1 pinned 2026-10-03
        with:
          version: '2.119.0'

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID secret is not set}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret is not set}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          # Applies ONLY migrations missing from the remote history table.
          # (--yes: non-interactive; safety comes from CI validation on the
          # PR plus pending-only semantics, not from an interactive prompt.)
          supabase db push --yes --linked
          echo "production migrations up to date"
