name: openbot-notify

# Relays PR CI events to the OpenBot webhook, so the babysit agent reacts
# to events instead of polling every 15 minutes.
#
# Pure relay by construction:
# - no checkout at all — nothing from the PR is read or executed;
# - job-level permissions: actions: read (the only API scope: listing
#   workflow runs for the last-finisher query; no code, no writes);
# - the body is a compact (< 2 KB) envelope of low-cardinality facts only
#   (event/action, PR number, head sha, workflow name, conclusion): no
#   titles, bodies, logs or actor identities.
#
# Secret handling: both the endpoint (OPENBOT_WEBHOOK_URL) and the signing
# key (OPENBOT_WEBHOOK_SECRET) are repository secrets — the repo is
# public, so neither may live in this file. Fork pull_request events do
# not carry secrets, so the single step exits successfully without
# sending when either is empty — a missing secret or URL can never turn
# this relay into a red check. Network or endpoint failures are
# warnings too (continue-on-error): telemetry must never fail a build it
# is only observing.
#
# Last-finisher rule: every relayed workflow fires a workflow_run completed
# event, so the decision counts pending workflow runs only (runs API,
# which is the completion authority). Non-workflow check runs (e.g. the
# coverage uploader) never fire a workflow_run event — if they gated the
# relay, a completed build could wake nobody (0 events); excluding them
# guarantees at least one send: the run whose completion event is the
# last to be processed always sees nothing pending. Two workflows that
# finish within the same second may both send — 2 events is acceptable,
# 0 is not. `Release MCP (auto)` (the main-push follower of CI) IS in the
# list, so the invariant holds on main pushes too. A run stuck
# queued/in_progress by a hung runner is the one accepted gap: that build
# already failed, and the daily test-flight monitor covers prod health.
# A transient failure of the pending query fails OPEN (send): 2 events
# is acceptable, 0 is not.
#
# Signature: x-openbot-signature = "sha256=" + hex HMAC-SHA256 over
# "<timestamp>.<delivery-id>.<exact body bytes>", keyed by the secret —
# the same envelope format the webhook route validates.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    # The workflow names this relay covers: the ones that run on PRs
    # (name: fields of .github/workflows/*.yml; parity-exclusion-guard
    # uses pull_request_target, which still triggers workflow_run) plus
    # Release MCP (auto), CI's main-push follower — every run that can be
    # counted as pending must also fire a relayed completion event, or a
    # green push could wake nobody.
    workflows:
      - CI
      - mutation
      - opencode-review
      - file-size
      - api-naming
      - parity-exclusion-guard
      - CodeQL Advanced
      - Deploy
      - Release MCP (auto)
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The last-finisher check queries workflow runs for the head sha.
      actions: read
    steps:
      # Checkout for the last-finisher counter: pending_runs.py is a real
      # file now (the previous indented inline python under `run: |` raised
      # IndentationError every run and the guard degenerated to send-always).
      - name: Checkout (for scripts/openbot-notify)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-09-25
        with:
          persist-credentials: false
      - name: Relay to OpenBot
        env:
          # The endpoint and the signing key are both repository secrets, so
          # the public repo never carries the webhook URL: an empty URL (or
          # an empty key — fork pull_request events carry no secrets, and
          # neither is created yet) makes the step exit successfully
          # without sending.
          OPENBOT_WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          OPENBOT_WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          # The relayed workflow names, comma-separated: the single source
          # for the last-finisher query. relay.test.sh pins this list and
          # the trigger block's `workflows:` stay identical.
          RELAYED_WORKFLOWS: CI,mutation,opencode-review,file-size,api-naming,parity-exclusion-guard,CodeQL Advanced,Deploy,Release MCP (auto)
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
          WORKFLOW_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Token for the last-finisher query (actions: read only). Fork
          # pull_request events never reach this call: the secrets guard
          # above exits first.
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${OPENBOT_WEBHOOK_URL:-}" ] || [ -z "${OPENBOT_WEBHOOK_SECRET:-}" ]; then
            echo "OPENBOT_WEBHOOK_URL/OPENBOT_WEBHOOK_SECRET not available (fork PR or unset) — nothing sent"
            exit 0
          fi
          # relay_decision — send on every failure-family conclusion; on
          # success/skipped send only when no other workflow run for the
          # same head sha is still queued or in progress, so the Babysit
          # is woken once, by the LAST check to finish, instead of ~8
          # times per push. pull_request events always relay.
          relay_decision() {
            case "$1" in
              pull_request) echo send; return ;;
              workflow_run) ;;
              *) echo skip; return ;;
            esac
            case "$2" in
              failure|timed_out|cancelled|action_required|startup_failure) echo send; return ;;
              success|skipped) ;;
              *) echo skip; return ;;
            esac
            # Fail OPEN on a transient query failure: a broken/limited API
            # call must not abort the relay before the send (2 events is
            # acceptable, 0 is not). A CRASH of the counting script must
            # be visible as ::warning:: and still fail OPEN — silent
            # scripts are invisible in green logs.
            #
            # Single source for the counted names: RELAYED_WORKFLOWS (env
            # below), the same list the trigger block declares —
            # relay.test.sh parses the trigger block and pins both stay
            # identical. Only listed runs may gate the send: every one of
            # them fires a relayed completion event, so the last finisher
            # always wakes the Babysit; unlisted runs (release-mcp,
            # openbot-notify-relay-test, test-flight, the openbot-notify
            # run itself) never fire one and would deadlock the chain.
            #
            # pending_runs.py is a real file executed through a checkout:
            # the inline python block indented under this `run: |` raised
            # IndentationError every time, and the fail-open mask made the
            # guard send on EVERY completed workflow (GH runs
            # 401818*). relay.test.sh executes this same file shape.
            _pending_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100") || {
              echo "::warning::last-finisher pending query failed (gh api); failing OPEN" >&2
              pending=0
            }
            if [ -n "${_pending_json:-}" ]; then
              pending=$(printf '%s' "$_pending_json" | python3 .github/scripts/openbot-notify/pending_runs.py) || {
                echo "::warning::pending_runs.py crashed; failing OPEN (see its traceback above)" >&2
                pending=0
              }
            fi
            if [ "$pending" -gt 0 ]; then
              # One late retry: a run that completes while another's
              # completion event is still in flight must not be missed by
              # both (the re-query sees it completed and sends).
              sleep 60
              _pending_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100") || {
                echo "::warning::last-finisher pending retry query failed (gh api); failing OPEN" >&2
                pending=0
              }
              if [ -n "${_pending_json:-}" ]; then
                pending=$(printf '%s' "$_pending_json" | python3 .github/scripts/openbot-notify/pending_runs.py) || {
                  echo "::warning::pending_runs.py crashed on retry; failing OPEN (see its traceback above)" >&2
                  pending=0
                }
              fi
            fi
            if [ "$pending" -gt 0 ]; then echo skip; else echo send; fi
          }
          decision=$(relay_decision "$EVENT_NAME" "$CONCLUSION")
          if [ "$decision" = "skip" ]; then
            echo "skipping relay: other checks still running for $HEAD_SHA"
            exit 0
          fi
          body=$(jq -nc \
            --arg occurredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg event "$EVENT_NAME" \
            --arg action "${EVENT_ACTION:-}" \
            --arg pr "${PR_NUMBER:-}" \
            --arg sha "${HEAD_SHA:-}" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg conclusion "$CONCLUSION" \
            '{type: "github.ci", occurredAt: $occurredAt, data: {
              event: $event,
              action: (if $action == "" then null else $action end),
              pr: (if $pr == "" then null else ($pr | tonumber) end),
              sha: (if $sha == "" then null else $sha end),
              workflow: (if $workflow == "" then null else $workflow end),
              conclusion: (if $conclusion == "" then null else $conclusion end)
            }}')
          ts=$(date +%s)
          delivery="gh-$RUN_ID-$RUN_ATTEMPT"
          # Sign "<timestamp>.<delivery-id>.<body bytes>"; the key comes from
          # the environment, never a process argument.
          sig=$(printf '%s.%s.%s' "$ts" "$delivery" "$body" | python3 -c 'import sys, hmac, hashlib, os; key = os.environ.get("OPENBOT_WEBHOOK_SECRET", "").encode(); print(hmac.new(key, sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS --max-time 15 --retry 2 \
            -H "Content-Type: application/json" \
            -H "x-openbot-timestamp: $ts" \
            -H "x-openbot-delivery-id: $delivery" \
            -H "x-openbot-signature: sha256=$sig" \
            --data-binary "$body" \
            "$OPENBOT_WEBHOOK_URL" > /dev/null
          echo "relayed $delivery ($EVENT_NAME)"
