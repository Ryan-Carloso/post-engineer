name: dead-code

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (dead-code scripts)
        run: node --test .github/scripts/dead-code/*.test.mjs

      - name: No unused files, exports, types or dependencies (knip)
        run: pnpm exec knip --no-progress

      - name: No dead shared contract exports
        run: node .github/scripts/dead-code/contracts.mjs

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install vulture
        run: python3 -m pip install --quiet --break-system-packages vulture

      - name: No dead CI script code (vulture)
        run: vulture .github/scripts --exclude "*/tests/*" --min-confidence 0
