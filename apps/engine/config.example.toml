# Engine runtime configuration. The engine is the publish worker: it
# publishes the scheduled slots whose media the user uploaded. It holds no
# secrets: Docker Compose injects them from .env next to docker-compose.yml:
# - SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY: the scheduled slots and uploads.
# - MPT_UPLOAD_API_BASE_URL=https://your-domain.example: the web app the
#   publisher posts to (POST /api/upload-content).
# - MONEYPRINT_API_SECRET: shared secret the publisher sends to the web app.

log_level = "INFO"
listen_host = "0.0.0.0"
listen_port = 8080
