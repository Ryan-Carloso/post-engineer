# VPS runtime environment (Docker Compose injects these; keep secrets out of
# this file):
# - MPT_STATE_BACKEND=memory (task state in memory; no external dependency).
#   Use MPT_STATE_BACKEND=supabase to persist task state in the
#   engine_task_state Supabase table instead: status polls then survive
#   engine restarts/redeploys (memory state is wiped on restart and polls
#   answer 404 "task not found" forever). Requires SUPABASE_URL and
#   SUPABASE_SERVICE_ROLE_KEY, plus supabase/engine-task-state.sql applied
#   once in the Supabase dashboard SQL editor. On boot, tasks left running
#   are marked failed so the web records the failure and refunds the token.
#   Ops constraint: the boot reconcile assumes a single writer — redeploys
#   MUST be stop-then-start, never rolling. Two overlapping processes let
#   the new boot reconcile fail+refund tasks the old process is still
#   generating (and the old process could later overwrite the FAILED row
#   with COMPLETE).
# - MPT_UPLOAD_API_BASE_URL=https://your-domain.example
# - MONEYPRINT_API_SECRET: shared auth secret — the web proxy sends it as
#   ``Authorization: Bearer`` plus ``x-user-id``; publish-back uses it too
#   for local mode, which preserves finished files under MPT_STORAGE_DIR/tasks.
# - MPT_STORAGE_DIR=/app/storage: persistent Docker volume on the VPS.
# - MPT_API_KEY or the engine's configured API-key mechanism: callers of the
#   engine API. The existing API-key authentication contract is unchanged.
#
# Operational limits are defined in docker-compose.yml: 2 CPUs, 4 GiB RAM,
# restart unless stopped, persistent storage, and rotating container logs.

[app]
max_video_duration_seconds = 40
max_video_script_characters = 600
# The script comes from the supplied segments; paragraph_number on the
# job is a legacy caller override. (script_target_words_min/max were
# removed with the LLM core: nothing read them.)
# Persistent per-user BGM history database. Keep this on durable storage.
bgm_history_db = "storage/bgm_history.sqlite3"

# Persona lip-sync intro (LongCat-Video-Avatar 1.5 on GPU).
# When true (default), jobs that include an inline persona generate the
# lip-synced persona intro before the main video. When false, the persona
# contributes only its voice/house voice and the video is rendered as a
# normal stock-footage video — much faster and no GPU required.
# Callers can also override per request with the `lipsync_enabled` field.
persona_lipsync_enabled = true

# Persona hook pacing and the face-fill outro are product-fixed in code
# (PERSONA_HOOK_* in app/services/persona_hook.py, FACE_FILL_* in
# app/services/task.py) — the values were validated against GPU intro cost and lipsync quality windows and are
# intentionally not tunable.

# 是否隐藏配置面板
hide_config = false

# 是否校验外部 API 和素材下载的 TLS 证书。
# 默认必须开启，避免 Pexels/Pixabay API key 和下载素材被中间人攻击篡改。
# 只有在企业代理或自签证书环境明确需要时，才临时改为 false。
tls_verify = true

# Pexels API Key
# Register at https://www.pexels.com/api/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pexels_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Use straight ASCII double quotes around each key. Smart quotes copied from rich text will break TOML parsing.
# 请使用英文半角双引号包裹每个 Key；从富文本复制来的弯引号会导致 TOML 解析失败。
# 特别注意格式，Key 用英文双引号括起来，多个Key用逗号隔开
pexels_api_keys = []

# Pixabay API Key
# Register at https://pixabay.com/api/docs/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pixabay_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Use straight ASCII double quotes around each key. Smart quotes copied from rich text will break TOML parsing.
# 请使用英文半角双引号包裹每个 Key；从富文本复制来的弯引号会导致 TOML 解析失败。
# 特别注意格式，Key 用英文双引号括起来，多个Key用逗号隔开
pixabay_api_keys = []

# Coverr API Key
# Register at https://coverr.co/developers?ctx=header_navigation to get your API key instantly.
# Free tier (Demo) is limited to 50 requests/hour — sufficient for a few
# video tasks per hour. Upgrade to Pro/Ultimate subscription for 2000/hour.
# Coverr provides free HD/4K stock videos (subject to Coverr license terms,
# see https://coverr.co/license), mostly 16:9 landscape; if
# you generate 9:16 short-form videos, prefer Pexels/Pixabay as primary
# and use Coverr to widen the catalog for landscape/cinematic content.
# You can use multiple keys to avoid rate limits.
# For example: coverr_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Use straight ASCII double quotes around each key. Smart quotes copied from rich text will break TOML parsing.
# 请使用英文半角双引号包裹每个 Key；从富文本复制来的弯引号会导致 TOML 解析失败。
# 特别注意格式，Key 用英文双引号括起来，多个Key用逗号隔开
coverr_api_keys = []

# TwelveLabs API Key (optional) — https://twelvelabs.io
# TwelveLabs (可选) 视频理解 / 多模态嵌入集成。
# Enables two opt-in features:
#   * Marengo (multimodal embeddings) semantically reorders the auto-generated
#     search terms by relevance to your video subject, so the most on-topic
#     B-roll is downloaded first when the timeline budget is tight.
#   * Pegasus (video understanding) can QA / describe a clip from its URL.
# Leave empty to keep the default behavior completely unchanged.
# Configure a TwelveLabs API key from the TwelveLabs dashboard (https://twelvelabs.io) and install the
# optional dependency with `uv sync --extra twelvelabs`.
# Register at https://playground.twelvelabs.io to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: twelvelabs_api_keys = ["tlk_123adsf4567","tlk_abd1321cd13ef"]
# 请使用英文半角双引号包裹每个 Key；从富文本复制来的弯引号会导致 TOML 解析失败。
twelvelabs_api_keys = []

# Reorder search terms by Marengo relevance before downloading footage.
# Requires twelvelabs_api_keys above. Ignored in "match materials to script"
# mode, where term order is intentionally the script's narrative order.
twelvelabs_rerank_terms = false

# Optional model overrides (defaults shown).
# twelvelabs_marengo_model = "marengo3.0"
# twelvelabs_pegasus_model = "pegasus1.5"

########## GNews API Key
# Visit https://gnews.io/register to get your API key.
# Used to fetch trending news matching a channel's
# niche and turn them into video topics. Can also be set via GNEWS_API_KEY env.
gnews_api_key = ""

# Subtitle Provider, "edge" or "whisper"
# If empty, the subtitle will not be generated
subtitle_provider = "edge"

#
# ImageMagick
#
# Once you have installed it, ImageMagick will be automatically detected, except on Windows!
# On Windows, for example "C:\Program Files (x86)\ImageMagick-7.1.1-Q16-HDRI\magick.exe"
# Download from https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-29-Q16-x64-static.exe

# imagemagick_path = "C:\\Program Files (x86)\\ImageMagick-7.1.1-Q16\\magick.exe"


#
# FFMPEG
#
# 通常情况下，ffmpeg 会被自动下载，并且会被自动检测到。
# 但是如果你的环境有问题，无法自动下载，可能会遇到如下错误：
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# 此时你可以手动下载 ffmpeg 并设置 ffmpeg_path，下载地址：https://www.gyan.dev/ffmpeg/builds/

# Under normal circumstances, ffmpeg is downloaded automatically and detected automatically.
# However, if there is an issue with your environment that prevents automatic downloading, you might encounter the following error:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# In such cases, you can manually download ffmpeg and set the ffmpeg_path, download link: https://www.gyan.dev/ffmpeg/builds/

# ffmpeg_path = "C:\\Users\\harry\\Downloads\\ffmpeg.exe"

# Video encoder. libx264 is the default and the only reliable choice on
# CPU-only hosts. Advanced users with a supported GPU can try a hardware
# encoder for speed: the engine PROBES the encoder by encoding one frame
# before a task starts, and falls back to libx264 automatically when the
# hardware or drivers cannot actually use it (a compiled-in encoder is not
# proof the device exists).
# Options: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_mf", "h264_videotoolbox"
video_codec = "libx264"
# ffmpeg preset. Defaults to veryfast because most self-hosted deployments
# have no GPU, where libx264's medium preset dominated the wall-clock cost of
# every encode (a ~13 min lip-sync splice was observed in production).
# Raise it for smaller files when you have CPU headroom.
# Options: "ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow"
video_preset = "veryfast"

# Discards material (stock video) frames that contain a detectable human
# face, so persona videos never show someone else's face in the B-roll
# (the persona face belongs to its lipsync image). Requires the
# opencv-python-headless dependency. Default false = unchanged behavior.
material_exclude_people = false

# Video encoder. libx264 is the safest default; advanced users can try hardware encoders.
# If the selected encoder is not supported by the current FFmpeg or driver, the app falls back to libx264.
# Available values: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_mf", "h264_videotoolbox"
# On macOS use h264_videotoolbox; on Linux CPU keep libx264.
#########################################################################################

# When the video is successfully generated, the API service provides a download endpoint for the video, defaulting to the service's current address and listening port.
# For example, http://127.0.0.1:8080/api/v1/download/<task-id>/final-1.mp4
# If you need to provide the service externally using a domain name (usually done with nginx as a proxy), you can set it to your domain name.
# For example, https://xxxx.com/api/v1/download/<task-id>/final-1.mp4
# endpoint="https://xxxx.com"
endpoint = ""


# Video material storage location
# material_directory = ""                    # Indicates that video materials will be downloaded to the default folder, the default folder is ./storage/cache_videos under the current project
# material_directory = "/user/harry/videos"  # Indicates that video materials will be downloaded to a specified folder
# material_directory = "task"                # Indicates that video materials will be downloaded to the current task's folder, this method does not allow sharing of already downloaded video materials

# 视频素材存放位置
# material_directory = ""                    #表示将视频素材下载到默认的文件夹，默认文件夹为当前项目下的 ./storage/cache_videos
# material_directory = "/user/harry/videos"  #表示将视频素材下载到指定的文件夹中
# material_directory = "task"                #表示将视频素材下载到当前任务的文件夹中，这种方式无法共享已经下载的视频素材

material_directory = ""

# Used for state management of the task.
# Redis is expected to be private to this app. Do not expose it to untrusted
# writers, because task state is deserialized for compatibility with existing
# records.
enable_redis = false
redis_host = "localhost"
redis_port = 6379

# Private SVG catalog (Doodly bundle). The artwork and its index are licensed
# and live in Cloudflare R2: they are fetched on demand and cached under
# <svg_cache_dir>, and are never committed. SVG is opt-in and defaults to
# off: without `svg_catalog_enabled` there is no SVG. When enabled, the
# catalog serves only posts whose material is "svg"; "broll" posts stay
# stock only and never get catalog artwork. It needs
# `svg_r2_prefix` and the R2_* credentials — a missing one, or an unreachable
# index, fails the render instead of silently degrading to stock.
svg_catalog_enabled = false
svg_r2_bucket = "videos"
svg_r2_prefix = ""
svg_cache_dir = "resource/svg/_cache"
# "texto" searches the FTS5 index and needs nothing extra. "semantico" /
# "hibrido" require an ONNX index under <index_dir>/models, which is not built
# yet: they log a warning and degrade to "texto" rather than failing.
svg_search_mode = "texto"
# Fill used for the canvas a catalog still is fitted onto. The artwork is
# fitted to the target aspect so combine_videos keeps the clip; this only
# decides what shows in the padding around it.
svg_canvas_background = "#FFFFFF"

# Verified stock material selection. Off by default: existing behavior is
# preserved exactly until an operator enables it. When enabled, a segment
# is verified only when a scorer clears it (minimum score plus runner-up
# margin, both relative scores, never probabilities). A segment that does
# not verify is dropped, never replaced by catalog SVG or a neutral
# background — except when no segment verifies at all: scored segments
# then keep their best-scored clips as an unverified fallback, and only
# unscored or scorer-unavailable segments, plus scored segments whose
# candidates were all already taken by another segment, stay dropped.
# R2 is the only source of SVG artwork: there is no subject mapping and
# no bundled artwork.
# The scorer is pluggable; the default scorer is SigLIP on ONNX (onnxruntime
# ships with the engine). It scores the preview image that Pexels, Pixabay and
# Coverr return for each clip (about 8 candidates per segment), so
# verification adds about a minute per video and downloads no extra clips.
# The model (about 220 MB, Apache-2.0, pinned revision and SHA-256 in
# app/services/siglip_model.py) is fetched on first use, or at boot, into the
# directory of material_verification_model_path; that directory must be
# writable and persisted (in Docker, under the /app/storage volume). Without
# the model the scorer fails closed (stock treated as unverified).
# Scores are tied to the scoring model: recalibrate min_score and
# runner_up_margin when the model changes.
# Verification stays off by default.
material_verification_enabled = false
material_verification_min_score = 0.01
material_verification_runner_up_margin = 0.005
# Docker: "/app/storage/models/siglip/model_q4.onnx"
material_verification_model_path = ""
redis_db = 0
redis_password = ""

# 文生视频时的最大并发任务数
max_concurrent_tasks = 1

# 并发任务已满后的最大排队任务数，超过后接口返回 429，避免匿名请求无限堆积
max_queued_tasks = 100

# Fill Schedule: how many hours ahead of "now" a pending slot gets its video
# generated. Generation starts immediately when a slot falls inside the
# horizon — there is no batch queue. Keep the default 24 so generation has
# enough lead time before the slot's scheduled publish time. Must be 1..168.
fill_schedule_generation_horizon_hours = 24


[whisper]
# Only effective when subtitle_provider is "whisper"

# Run on GPU with FP16
# model = WhisperModel(model_size, device="cuda", compute_type="float16")

# Run on GPU with INT8
# model = WhisperModel(model_size, device="cuda", compute_type="int8_float16")

# Run on CPU with INT8
# model = WhisperModel(model_size, device="cpu", compute_type="int8")

# recommended model_size: "large-v3"
model_size = "large-v3"
# if you want to use GPU, set device="cuda"
device = "CPU"
compute_type = "int8"


[proxy]
### Use a proxy to access the Pexels API
### Format: "http://<username>:<password>@<proxy>:<port>"
### Example: "http://user:pass@proxy:1234"
### Doc: https://requests.readthedocs.io/en/latest/user/advanced/#proxies

# http = "http://10.10.1.10:3128"
# https = "http://10.10.1.10:1080"

[elevenlabs]
# ElevenLabs API Key
# Get your API key at https://elevenlabs.io/app/settings/api-keys
# Mark voices as favorites in the ElevenLabs voice library to make them appear here.
api_key = ""
# Model: eleven_multilingual_v2 | eleven_flash_v2_5 | eleven_v3
model_id = "eleven_multilingual_v2"

[ui]
# UI related settings
# 是否隐藏日志信息
# Whether to hide logs in the UI
hide_log = false

# ── Subtitle style defaults ──────────────────────────────────────────────────
# Read by app/models/schema.py (VideoParams) and respected by the WebUI.
# These set the DEFAULT caption look for every task (CLI, API, WebUI, batch).
# Override per-task by passing the field explicitly in VideoParams.
#
# Subtitle position settings. Available values: "top", "center", "bottom", "custom"
subtitle_position = "center"
# Custom position as percentage from top (0-100), only effective when subtitle_position = "custom"
custom_position = 50.0
# Subtitle font: a .ttf filename inside resource/fonts/. No font is bundled
# with the repo (resource/fonts/ is gitignored) — add your own
# openly-licensed font file there and set its name below.
# font_name = "YourFont-Regular.ttf"
text_fore_color = "#FFFFFF"
# Caption background: true = auto highlight box, false = transparent,
# "#RRGGBB" = solid color of your choice.
text_background_color = false
rounded_subtitle_background = false
font_size = 65
stroke_color = "#000000"
# Outline width. Thicker stroke keeps text legible without a background box.
stroke_width = 2.5

########## Upload-Post (Cross-post to TikTok/Instagram/YouTube Shorts)
# Upload-Post allows you to automatically cross-post generated videos to TikTok, Instagram and YouTube Shorts.
# Visit https://upload-post.com to create an account and get your API key.
# API Documentation: https://docs.upload-post.com

# Enable/disable Upload-Post integration
upload_post_enabled = false

# Your Upload-Post API key
upload_post_api_key = ""

# Your Upload-Post username
upload_post_username = ""

# Platforms to cross-post to (options: "tiktok", "instagram", "youtube")
upload_post_platforms = ["tiktok", "instagram"]

# Automatically cross-post videos after generation (if false, you'll need to call the API manually)
upload_post_auto_upload = false

# YouTube Shorts privacy status (options: "public", "unlisted", "private")
upload_post_youtube_privacy_status = "public"

# Chatterbox TTS (self-hosted, OpenAI-compatible) ##########################
# Chatterbox (https://github.com/resemble-ai/chatterbox, MIT) is an open-source,
# locally hosted TTS model with zero-shot voice cloning — a self-hostable
# alternative to ElevenLabs. Run a server that exposes an OpenAI-compatible
# endpoint at POST {base_url}/audio/speech (e.g. devnen/Chatterbox-TTS-Server
# or travisvn/chatterbox-tts-api), then set base_url below. In the WebUI pick
# "Chatterbox TTS" as the TTS server, or via the API pass a voice_name like
# "chatterbox:<voice>". Subtitles use the full-text fallback (no word-level
# timestamps); set subtitle_provider = "whisper" for tighter sync.
[chatterbox]
# Targets the local CPU TTS server (local_tts/server.py; the `tts` service in
# docker-compose.yml). House voices come from app/services/voice_catalog.json.
# api_key MUST equal the CHATTERBOX_HTTP_SECRET the tts service was started
# with (the server 401s without it); same value as [cloned_voices]
# registry_api_key below. Under docker-compose the MPT_CHATTERBOX_BASE_URL /
# MPT_CHATTERBOX_API_KEY env vars override these two values.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"

# Per-user Chatterbox voice cloning (TRUE cloning) #############################
# The engine registers each user's reference audio on the Chatterbox voice
# volume via an admin registry service (not the public /audio/speech TTS URL).
# Leave registry_base_url empty to disable registration (rows stay failed with
# error_code registry_not_configured). Point registry_base_url at the local CPU
# TTS server (http://127.0.0.1:4123 locally, http://tts:4123 in docker-compose),
# which hosts POST/DELETE /v1/voices and clones with Chatterbox Nano.
# Secrets may also be set via env: CHATTERBOX_REGISTRY_BASE_URL,
# CHATTERBOX_REGISTRY_API_KEY (typically the same value as CHATTERBOX_HTTP_SECRET).
[cloned_voices]
registry_base_url = ""
registry_api_key = ""

# OpenRouter TTS (hosted, multi-vendor) #######################################
# OpenRouter (https://openrouter.ai) routes one API key to many hosted TTS
# vendors (OpenAI, Gemini, Mistral, ElevenLabs, Grok, Azure, ...) behind a
# single OpenAI-compatible endpoint: POST /api/v1/audio/speech. Configure a key
# and at least one model below to enable it; while either is empty the provider
# is absent from the voice catalog and never appears in the UI picker.
#
# `models` is an allowlist of OpenRouter speech model ids, NOT a voice list.
# The engine then asks the models API which voices each one supports
# (GET /api/v1/models?output_modalities=speech, field `supported_voices`) and
# builds ids of the form `openrouter:<model>:<voice>`. The model is part of the
# id because OpenRouter voices are per-model: `eve` is a Grok voice, `Kore` a
# Gemini one, and the same name can mean different things per vendor.
#
# Pick models deliberately. OpenRouter's whole speech catalog is 35 models and
# ~824 model/voice pairs, differing in price, language coverage and capability
# — the engine will not choose one on your behalf. List the models you want,
# or as many as your picker should offer. Voices are named in each model's page
# on https://openrouter.ai/models?fmt=chat&output_modalities=speech
[openrouter]
# Your OpenRouter key: https://openrouter.ai/keys
api_key = ""
# Model ids to offer. Example values: "mistralai/voxtral-mini-tts-2603",
# "x-ai/grok-voice-tts-1.0", "elevenlabs/eleven-multilingual-v2".
# Accepts an array or a comma-separated string. Empty disables the provider.
models = []
# Voices of a voice-cloning or prompt-driven model (Fish Audio, Seed Audio) are
# not listed by the models API — those models report `supported_voices: null`.
# They stay reachable by passing their id directly:
#   voice_name = "openrouter:fish-audio/s2-pro"
#
# Note on speed: OpenRouter returns a 400 when a non-default `speed` is sent to
# a model with no speed control, and the models API reports no capability flags
# for speech models. The engine therefore sends `speed` only when the job asks
# for a rate other than 1.0, which the default never does.

[longcat]
# The persona lip-sync model: LongCat-Video-Avatar 1.5 on Modal (modal_longcat.py).
# This section was `[infinitetalk]`. An existing config.toml that still has the
# old name is NOT an error — config.longcat reads as {} and every key below falls
# back to the same default shown here — but the old section becomes dead config,
# so rename it.
# The Modal endpoints and bearer secret are ENV VARS, not TOML (they differ
# per environment — dev and prod use separate Modal accounts):
#   LONGCAT_SUBMIT_URL / LONGCAT_STATUS_URL / LONGCAT_DOWNLOAD_URL
#   LONGCAT_HTTP_SECRET  (must match the secret deployed via:
#     `modal secret create longcat-http LONGCAT_HTTP_SECRET=...`)
# Clip length is set by --num_segments, not by the audio: the client rounds the
# segment count UP from the measured speech length (trailing padding excluded, so
# a narration near a boundary does not buy an extra segment) so a clip never
# renders shorter than its narration. The surplus is trimmed when it is spliced
# in. Segment granularity is 3.2s, so a clip can be up to ~3s longer than the
# narration it covers.
poll_interval_seconds = 5
timeout_seconds = 1800
# Fallback only: both production callers pass an explicit duration (the persona
# hook window, and the face-fill tail), so this is never used on a real task.
intro_duration_seconds = 5

[bgm]
# Automatic BGM selection uses only tracks explicitly listed in this catalog.
catalog_file = "resource/songs/catalog.toml"

[search]
# Search client kept for place photos only (Phase 5 PR 5: the pre-script
# fact lookup is deleted). Off by default: turning it on needs
# TAVILY_API_KEY in the environment (never in this file) — place photos
# use Tavily only; Exa stays in the provider map for the boot check but
# backs no feature. With enabled = true and no key at all the engine
# refuses to start.
enabled = false
providers = ["tavily", "exa"]
timeout_seconds = 8.0
# Photos of named places, for every video type: drawings, stock footage and persona videos
# (a persona video keeps its face intro and outro on screen). When the script names a
# place the subject does not cover, one extra Tavily image search looks for its
# photo; only an image whose title or description names the place is used, at most
# 2 per video, in place of the clip nearest to the spoken name. The photos are
# third-party content: whoever switches this on takes the rights risk. Off by
# default; needs TAVILY_API_KEY (the only provider that describes its images).
place_photos = false
