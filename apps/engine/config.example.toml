[elevenlabs]
# ElevenLabs API Key
# Get your API key at https://elevenlabs.io/app/settings/api-keys
# Mark voices as favorites in the ElevenLabs voice library to make them appear here.
api_key = ""
# Model: eleven_multilingual_v2 | eleven_flash_v2_5 | eleven_v3
model_id = "eleven_multilingual_v2"

[ui]
# UI related settings
# 是否隐藏日志信息
# Whether to hide logs in the UI
hide_log = false

# ── Subtitle style defaults ──────────────────────────────────────────────────
# Read by app/models/schema.py (VideoParams) and respected by the WebUI.
# These set the DEFAULT caption look for every task (CLI, API, WebUI, batch).
# Override per-task by passing the field explicitly in VideoParams.
#
# Subtitle position settings. Available values: "top", "center", "bottom", "custom"
subtitle_position = "center"
# Custom position as percentage from top (0-100), only effective when subtitle_position = "custom"
custom_position = 50.0
# Subtitle font: a .ttf filename inside resource/fonts/. No font is bundled
# with the repo (resource/fonts/ is gitignored) — add your own
# openly-licensed font file there and set its name below.
# font_name = "YourFont-Regular.ttf"
text_fore_color = "#FFFFFF"
# Caption background: true = auto highlight box, false = transparent,
# "#RRGGBB" = solid color of your choice.
text_background_color = false
rounded_subtitle_background = false
font_size = 65
stroke_color = "#000000"
# Outline width. Thicker stroke keeps text legible without a background box.
stroke_width = 2.5

########## Upload-Post (Cross-post to TikTok/Instagram/YouTube Shorts)
# Upload-Post allows you to automatically cross-post generated videos to TikTok, Instagram and YouTube Shorts.
# Visit https://upload-post.com to create an account and get your API key.
# API Documentation: https://docs.upload-post.com

# Enable/disable Upload-Post integration
upload_post_enabled = false

# Your Upload-Post API key
upload_post_api_key = ""

# Your Upload-Post username
upload_post_username = ""

# Platforms to cross-post to (options: "tiktok", "instagram", "youtube")
upload_post_platforms = ["tiktok", "instagram"]

# Automatically cross-post videos after generation (if false, you'll need to call the API manually)
upload_post_auto_upload = false

# YouTube Shorts privacy status (options: "public", "unlisted", "private")
upload_post_youtube_privacy_status = "public"

# Chatterbox TTS (self-hosted, OpenAI-compatible) ##########################
# Chatterbox (https://github.com/resemble-ai/chatterbox, MIT) is an open-source,
# locally hosted TTS model with zero-shot voice cloning — a self-hostable
# alternative to ElevenLabs. Run a server that exposes an OpenAI-compatible
# endpoint at POST {base_url}/audio/speech (e.g. devnen/Chatterbox-TTS-Server
# or travisvn/chatterbox-tts-api), then set base_url below. In the WebUI pick
# "Chatterbox TTS" as the TTS server, or via the API pass a voice_name like
# "chatterbox:<voice>". Subtitles use the full-text fallback (no word-level
# timestamps); set subtitle_provider = "whisper" for tighter sync.
[chatterbox]
# Defaults target travisvn/chatterbox-tts-api running locally on port 4123.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
# Voices exposed by your server; shown in the WebUI dropdown as chatterbox:<name>
voices = ["default-Female"]

[infinitetalk]
# The Modal endpoints and bearer secret are ENV VARS, not TOML (they differ
# per environment — dev and prod use separate Modal accounts):
#   INFINITETALK_SUBMIT_URL / INFINITETALK_STATUS_URL / INFINITETALK_DOWNLOAD_URL
#   INFINITETALK_HTTP_SECRET  (must match the secret deployed via:
#     `modal secret create infinitetalk-http INFINITETALK_HTTP_SECRET=...`)
poll_interval_seconds = 5
timeout_seconds = 1800
intro_duration_seconds = 5
[bgm]
# Automatic BGM selection uses only tracks explicitly listed in this catalog.
catalog_file = "resource/songs/catalog.toml"
