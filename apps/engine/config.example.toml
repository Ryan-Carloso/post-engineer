#
# ImageMagick
#
# Once you have installed it, ImageMagick will be automatically detected, except on Windows!
# On Windows, for example "C:\Program Files (x86)\ImageMagick-7.1.1-Q16-HDRI\magick.exe"
# Download from https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-29-Q16-x64-static.exe

# imagemagick_path = "C:\\Program Files (x86)\\ImageMagick-7.1.1-Q16\\magick.exe"


#
# FFMPEG
#
# 通常情况下，ffmpeg 会被自动下载，并且会被自动检测到。
# 但是如果你的环境有问题，无法自动下载，可能会遇到如下错误：
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# 此时你可以手动下载 ffmpeg 并设置 ffmpeg_path，下载地址：https://www.gyan.dev/ffmpeg/builds/

# Under normal circumstances, ffmpeg is downloaded automatically and detected automatically.
# However, if there is an issue with your environment that prevents automatic downloading, you might encounter the following error:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# In such cases, you can manually download ffmpeg and set the ffmpeg_path, download link: https://www.gyan.dev/ffmpeg/builds/

# ffmpeg_path = "C:\\Users\\harry\\Downloads\\ffmpeg.exe"

# Video encoder. libx264 is the default and the only reliable choice on
# CPU-only hosts. Advanced users with a supported GPU can try a hardware
# encoder for speed: the engine PROBES the encoder by encoding one frame
# before a task starts, and falls back to libx264 automatically when the
# hardware or drivers cannot actually use it (a compiled-in encoder is not
# proof the device exists).
# Options: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_mf", "h264_videotoolbox"
video_codec = "libx264"
# ffmpeg preset. Defaults to veryfast because most self-hosted deployments
# have no GPU, where libx264's medium preset dominated the wall-clock cost of
# every encode (a ~13 min lip-sync splice was observed in production).
# Raise it for smaller files when you have CPU headroom.
# Options: "ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow"
video_preset = "veryfast"

# Discards material (stock video) frames that contain a detectable human
# face, so persona videos never show someone else's face in the B-roll
# (the persona face belongs to its lipsync image). Requires the
# opencv-python-headless dependency. Default false = unchanged behavior.
material_exclude_people = false

# Video encoder. libx264 is the safest default; advanced users can try hardware encoders.
# If the selected encoder is not supported by the current FFmpeg or driver, the app falls back to libx264.
# Available values: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_mf", "h264_videotoolbox"
# On macOS use h264_videotoolbox; on Linux CPU keep libx264.
#########################################################################################

# When the video is successfully generated, the API service provides a download endpoint for the video, defaulting to the service's current address and listening port.
# For example, http://127.0.0.1:8080/api/v1/download/<task-id>/final-1.mp4
# If you need to provide the service externally using a domain name (usually done with nginx as a proxy), you can set it to your domain name.
# For example, https://xxxx.com/api/v1/download/<task-id>/final-1.mp4
# endpoint="https://xxxx.com"
endpoint = ""


# Video material storage location
# material_directory = ""                    # Indicates that video materials will be downloaded to the default folder, the default folder is ./storage/cache_videos under the current project
# material_directory = "/user/harry/videos"  # Indicates that video materials will be downloaded to a specified folder
# material_directory = "task"                # Indicates that video materials will be downloaded to the current task's folder, this method does not allow sharing of already downloaded video materials

# 视频素材存放位置
# material_directory = ""                    #表示将视频素材下载到默认的文件夹，默认文件夹为当前项目下的 ./storage/cache_videos
# material_directory = "/user/harry/videos"  #表示将视频素材下载到指定的文件夹中
# material_directory = "task"                #表示将视频素材下载到当前任务的文件夹中，这种方式无法共享已经下载的视频素材

material_directory = ""

# Used for state management of the task.
# Redis is expected to be private to this app. Do not expose it to untrusted
# writers, because task state is deserialized for compatibility with existing
# records.
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# 文生视频时的最大并发任务数
max_concurrent_tasks = 1

# Default "additional requirements" injected into every LLM script-generation
# call when the task doesn't override video_script_prompt. Written in English
# (the instruction language) so it applies regardless of the output language
# (the output language is passed separately as `language: <code>`). This version
# pushes the model toward storytelling with a random emotion and a random
# narrative angle so the output feels less generic and more varied across runs.
# Set to "" to disable and let the LLM write long-form paragraphs.
default_video_script_prompt = "Use a storytelling style. For each script, choose one emotion at random and one narrative angle at random, then write a unique, human-sounding story around them. Keep the pacing tight, the hook strong, and the language specific instead of generic. Avoid clichés, vague motivation, and predictable structure. End every script with a short call to action like 'Follow us for more gains.'"

# 并发任务已满后的最大排队任务数，超过后接口返回 429，避免匿名请求无限堆积
max_queued_tasks = 100

# Fill Schedule: how many hours ahead of "now" a pending slot gets its video
# generated. Generation starts immediately when a slot falls inside the
# horizon — there is no batch queue. Keep the default 24 so generation has
# enough lead time before the slot's scheduled publish time. Must be 1..168.
fill_schedule_generation_horizon_hours = 24


