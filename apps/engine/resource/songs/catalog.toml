# Background-music catalog (issue #489).
#
# Every track here is CC0 1.0 (public domain dedication): free for
# commercial use, no attribution required, redistribution allowed. Each
# entry records its license and source so the claim is checkable —
# never add a track without verifying both first. See README.md.
#
# The loader only reads `file` and `moods`; `license`, `source`,
# `title` and `creator` are provenance metadata. A mood lists every
# track that fits it; the mixer picks one at random per video.

