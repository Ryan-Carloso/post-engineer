# Engine CPU on the VPS — ffmpeg/TTS/render only (no GPU).
# InfiniteTalk/H200 stays on Modal and is reached over HTTP.
#
# Secrets come from .env next to this file (never committed):
#   MONEYPRINT_API_SECRET                     -> shared auth secret (web proxy + publish-back)
#   MPT_UPLOAD_API_BASE_URL                   -> public engine URL
#
# config.toml (no real secrets) is mounted read-only from ./config.toml.

services:
  engine:
    image: mpt-engine-cpu:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpt-engine-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      MPT_STATE_BACKEND: supabase
      MPT_STORAGE_DIR: /app/storage
      TZ: UTC
      # Build metadata reported by GET /version and /health. Injected at
      # deploy time: the VPS deploy generates them from the commit being
      # deployed (VERSION=MAJOR.MINOR.PR, PR_NUMBER/BUILD=that PR,
      # COMMIT=full SHA) and exports them before `docker compose up --build`,
      # e.g.
      #   VERSION=1.28.152 PR_NUMBER=152 BUILD=152 COMMIT=$(git rev-parse HEAD)
      # CI injects its own values so the test suite exercises the same path.
      # Empty locally: the app falls back to the mounted VERSION file for the
      # version and reports null pr/build/commit.
      VERSION: ${VERSION:-}
      PR_NUMBER: ${PR_NUMBER:-}
      BUILD: ${BUILD:-}
      COMMIT: ${COMMIT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - engine_storage:/app/storage
      - ./config.toml:/app/config.toml:ro
      # Platform version fallback: the repo-root VERSION file (the
      # MAJOR.MINOR release baseline, e.g. `1.28`) is mounted read-only so
      # /health and the startup log still report a version when VERSION is
      # not injected (local runs). Injected VERSION/PR_NUMBER/BUILD/COMMIT
      # env vars take precedence.
      - ../../VERSION:/app/VERSION:ro
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=4).status < 500 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  engine_storage:
