# Chatterbox voice catalog on the `chatterbox-voices` Modal volume.
# Each section maps a logical voice name (used by the engine as
# "chatterbox:<name>") to its reference sample and Chatterbox language code.
# Reference paths are relative to /voices and must not escape it.

[ryan]
reference = "ryan/reference.wav"
language_id = "pt"

[en_us_female_01]
reference = "en_us_female_01/reference.wav"
language_id = "en"

[en_us_female_02]
reference = "en_us_female_02/reference.wav"
language_id = "en"

[en_us_female_03]
reference = "en_us_female_03/reference.wav"
language_id = "en"

[en_us_female_04]
reference = "en_us_female_04/reference.wav"
language_id = "en"
