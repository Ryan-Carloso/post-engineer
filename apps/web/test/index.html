<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Engineer API - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #e1e5e9;
            border-radius: 8px;
            background: #f9f9f9;
            cursor: pointer;
        }

        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
            display: none;
        }

        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .response h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .response pre {
            background: white;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Post Engineer API</h1>
        <p class="subtitle">Teste a API de upload de vídeos</p>

        <form id="uploadForm">
            <div class="form-group">
                <label for="video">Arquivo de Vídeo *</label>
                <input type="file" id="video" name="video" accept="video/*" required>
                <div class="file-info" id="fileInfo"></div>
            </div>

            <div class="form-group">
                <label for="title">Título do Vídeo *</label>
                <input type="text" id="title" name="title" placeholder="Ex: Meu Vídeo Incrível" required>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>
                <textarea id="description" name="description" placeholder="Descreva seu vídeo..."></textarea>
            </div>

            <div class="form-group">
                <label for="tags">Tags (separadas por vírgula)</label>
                <input type="text" id="tags" name="tags" placeholder="Ex: teste, api, youtube">
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Enviar Vídeo</span>
            </button>
        </form>

        <div id="response" class="response">
            <h3 id="responseTitle"></h3>
            <pre id="responseContent"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('video');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const responseDiv = document.getElementById('response');
        const responseTitle = document.getElementById('responseTitle');
        const responseContent = document.getElementById('responseContent');
        const fileInfo = document.getElementById('fileInfo');

        // Mostrar informações do arquivo selecionado
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                fileInfo.textContent = `📁 ${file.name} (${sizeMB} MB)`;
            } else {
                fileInfo.textContent = '';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('video', fileInput.files[0]);
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('tags', document.getElementById('tags').value);
            formData.append('privacyStatus', document.getElementById('privacyStatus').value);

            // Mostrar loading
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span>Enviando...';
            responseDiv.style.display = 'none';

            try {
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Mostrar resposta
                responseDiv.style.display = 'block';
                responseDiv.className = 'response ' + (response.ok ? 'success' : 'error');
                responseTitle.textContent = response.ok ? '✅ Sucesso!' : '❌ Erro!';
                responseContent.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                responseDiv.style.display = 'block';
                responseDiv.className = 'response error';
                responseTitle.textContent = '❌ Erro de Conexão!';
                responseContent.textContent = error.message;
            } finally {
                // Resetar botão
                submitBtn.disabled = false;
                btnText.textContent = 'Enviar Vídeo';
            }
        });
    </script>
</body>
</html>
