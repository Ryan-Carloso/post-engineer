# Web (Next.js) on the VPS — replaced Vercel.
#
# Deployed by ../../../../deploy.sh (docker compose up -d --build when
# apps/web changes). Sits behind the Caddy edge proxy (post-engineer.com).
#
# Secrets come from .env next to this file (never committed):
#   NEXT_PUBLIC_* -> inlined at build time (image must be rebuilt on change)
#   server-only   -> passed to the container at runtime via env_file

services:
  web:
    image: post-engineer-web:latest
    build:
      # Monorepo root: pnpm workspace lockfile + VERSION live there.
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Build metadata baked into the bundle at build time (see
        # apps/web/Dockerfile). The VPS deploy generates these from the
        # commit being deployed and exports them before
        # `docker compose build`, e.g.
        #   VERSION=1.28.152 PR_NUMBER=152 BUILD=152 COMMIT=$(git rev-parse HEAD)
        # Empty locally: the app falls back to the VERSION file for the
        # version and reports null pr/build/commit.
        VERSION: ${VERSION:-}
        PR_NUMBER: ${PR_NUMBER:-}
        BUILD: ${BUILD:-}
        COMMIT: ${COMMIT:-}
    container_name: post-engineer-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      TZ: UTC
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
